test_data:
  test_keys: none published
  test_cards: not applicable
  magic_identifiers: none published
  time_simulation: none published
  fixtures: none published
safe_read_operations:
  note: >-
    The closest thing to a no-risk first call an integrator has, all read-only and all
    still requiring a token.
  operations:
  - GET /api/system/ping (NAR Registry Client API, operationId ping)
  - GET /api/system/ping (TIGRS Registry Client API, operationId pingUsingGET)
  - GET /optimal/v1/system/ping (Optimal System API, operationId ping)
  - GET /reference-data (Xpansiv Connect API, operationId getReferenceData)
  - GET /retirements/program/{RetirementProgramCode}/rules (Xpansiv Connect API,
    operationId getRegistryRules)

source: mcp/xpansiv-mcp-tools-list.json + openapi/*.yml (11 harvested OpenAPI descriptions)
provider: Xpansiv
note: >-
  The crosswalk is unusual for this provider and the shape is the finding. Xpansiv's MCP
  server is a DOCUMENTATION server: every one of its seven tools operates ON the OpenAPI
  descriptions and docs, not on the environmental-commodity resources those descriptions
  govern. So no MCP tool binds to any Xpansiv operationId — all seven are mcp_only, and
  all 110 REST operations are rest_only. This is not a gap in our mapping; it is the
  actual divergence between the two surfaces, and it is what an agent needs to know
  before planning a workflow: it can DISCOVER every Xpansiv API through MCP, and must
  EXECUTE against REST (or FIX) with separately issued credentials.

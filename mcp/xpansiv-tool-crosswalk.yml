crosswalk: []
mcp_only:
- tool: whoami
  reason: Portal identity introspection; no Xpansiv business API exposes the caller's
    portal identity.
- tool: list-apis
  reason: Meta-operation over the portal's spec catalog. The nearest REST analogue would
    be an /.well-known/api-catalog document, which Xpansiv does not serve.
- tool: get-endpoints
  reason: Reads paths[] out of a stored OpenAPI description; no runtime API operation
    backs it.
- tool: get-endpoint-info
  reason: Reads one operation object (parameters, security, examples) out of a stored
    OpenAPI description.
- tool: get-security-schemes
  reason: Reads components.securitySchemes out of a stored OpenAPI description.
- tool: get-full-spec-document
  reason: Returns a whole spec document. Equivalent to GET
    https://developer.xpansiv.com/_spec/openapi/<bundle>/<file>.yaml, which is a static
    docs asset rather than an API operation.
- tool: search
  reason: Full-text documentation search. Xpansiv publishes no search API.

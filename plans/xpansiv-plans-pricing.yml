note: >-
  Xpansiv publishes no plans, tiers, prices or usage quotas for any of its APIs. There is
  no /pricing page (https://www.xpansiv.com/pricing returns 404) and no pricing link
  anywhere in the site navigation, which covers commodities, solutions, trading
  platforms, registries, data, connect, power, partners, news and careers. This is
  expected for the market segment: Xpansiv is regulated-adjacent commodity market
  infrastructure sold to institutional counterparties — exchange members, brokers,
  registry account holders, utilities and corporate buyers — under negotiated
  agreements, with API access issued as part of an existing commercial relationship. The
  developer portal makes the gate explicit rather than hiding it: Xpansiv Connect says
  "one has request credentials from Xpansiv", TIGR says to "reach out to the TIGR
  administrator", and Managed Solutions keys are generated only from inside a logged-in
  account. This is a plan_count of 0 with a stated cause, not an unchecked field.

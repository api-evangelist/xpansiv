provider: Xpansiv
format: http-status
rfc9457: false
envelope_note: >-
  Xpansiv does not publish one error envelope. Error bodies are declared as
  application/json on 222 responses and */* on 89, and no response anywhere declares
  application/problem+json. Integrators should branch on HTTP status, not on a shared
  problem-type URI. The Marketplace FIX surface has its own error model entirely
  (BusinessMessageReject 35=j for unsupported messages, session-level Reject 35=3 for
  malformed ones) and does not use HTTP status at all.

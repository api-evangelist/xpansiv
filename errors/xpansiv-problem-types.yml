- status: 400
  title: Bad Request
  occurrences: 89
  meaning: The request you sent is incorrect.
  remediation: >-
    Validate the JSON payload before sending; URL-encode query parameters (the Xpansiv
    Data docs call out spaces in groupName needing %20); check required path parameters
    such as AccountIdentifier, ProgramCode, ledgerIdentifier and readingProfileCode.
  source: openapi + https://developer.xpansiv.com/developer-portal/xpansiv-data/errors
- status: 401
  title: Unauthorized
  occurrences: 81
  meaning: Your API key is wrong, or the bearer token is missing or expired.
  remediation: >-
    Re-issue a token. Registry and Power Markets clients POST to
    https://apxjwtauthprod.apx.com/oauth/token; Connect and Data clients POST to
    https://auth.xpansiv.com/oauth/token. Tokens are short-lived (Connect returns
    expires_in 86400). The auth endpoints themselves return 401 with status message
    "Bad Request - Invalid Login ID or Password" on bad credentials.
  source: openapi + the four published authentication pages

domain_error_surfaces:
- name: APX Power Markets scheduling validation errors
  operation: getStatus
  path: /fileRegistry/file/{fileHandle}/status
  api: APX Power Markets File Registry API
  note: >-
    Submitted ISO scheduling files are validated asynchronously. A 200 on uploadFile
    does not mean the schedule was accepted — validation errors are retrieved separately
    through getStatus against the returned fileHandle. This is the most common
    integration mistake on this API and it is not visible in the HTTP status code.
  source: openapi/xpansiv-apx-power-markets-file-registry-openapi.yml
- name: Managed Solutions facility upload error correction
  operations:
  - facilityUploadErrorPreviewBulk
  - facilityUploadSingleRowErrorPreview
  - facilityUploadApplyFixBulk
  - facilityUploadApplyFixSingleRow
  api: Xpansiv Managed Solutions API
  note: >-
    A bulk facility upload that fails returns a per-row error set that is previewed and
    then fixed in place, rather than resubmitted. Errors here are addressable resources
    with their own operations, not just response bodies.
  source: openapi/xpansiv-managed-solutions-openapi.yml
- name: FIX session and business rejects
  api: Xpansiv Marketplace FIX API
  codes:
  - code: 35=j
    name: BusinessMessageReject
    meaning: Incoming message is not listed in the specification, or is not supported by
      the negotiated session type (Transaction / DropCopy / MarketData).
  - code: 35=3
    name: Reject
    meaning: Session-level reject for a malformed incoming message.
  source: https://developer.xpansiv.com/developer-portal/marketplace/fix-api
common_user_errors:
  source: https://developer.xpansiv.com/developer-portal/xpansiv-data/errors
  note: The provider distinguishes API-level errors from caller mistakes and documents
    the latter explicitly.
  items:
  - Placing multiple curl commands on the same line without proper separation.
  - Omitting the Authorization; Bearer <token> header.
  - Improper JSON body formatting (single quotes, missing commas).
  - Not URL-encoding query parameters, e.g. spaces in groupName must be %20.

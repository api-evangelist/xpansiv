- aid: xpansiv-data
  name: Xpansiv Data API
  description: Real-time, end-of-day and historical transaction-based market data
    for environmental and energy commodities, sourced from CBL and global
    intermediaries including Evolution Markets. Delivered as time series, data-lake
    file groups and NCSV downloads over a JWT-authenticated REST API, with a
    first-party Python SDK.

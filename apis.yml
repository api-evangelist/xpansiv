apis:
- aid: xpansiv:xpansiv-data
  name: Xpansiv Data API
  description: >-
    Real-time, end-of-day and historical transaction-based market data for environmental and energy commodities,
    sourced from CBL and global intermediaries including Evolution Markets. Delivered as time series,
    data-lake file groups and NCSV downloads over a JWT-authenticated REST API, with a first-party Python
    SDK.
  humanURL: https://developer.xpansiv.com/developer-portal/xpansiv-data
  baseURL: https://api.data.xpansiv.com
  tags:
  - Market Data
  - Time Series

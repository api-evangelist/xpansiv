- aid: xpansiv:xpansiv-exchange-api
  name: Xpansiv Exchange API
  description: >-
    The Exchange APIs allow users to take various actions, both read and write, for their interactions
    with  execution venues, such as the CBL platform. The Search Deposits API allows the user to search
    the current deposits placed on execution venues. The Deposit Creation API allows the user to place
    inventory on deposit on a target execution venue.  The Deposit Withdraw API allows the user to withdraw
    and place back into inventory deposits held on an execution venue.  The Deposit Withdraw and Create
    Retirements API allows the user to withdraw and retire deposits held on an  execution venue.  The
    Deposit Settlement API call would be used to settle executed trades on an execution venue by an execution  venue
    operator.
  humanURL: https://developer.xpansiv.com/developer-portal/xpansiv-connect
  baseURL: https://connect.xpansiv.com/app/api/v1

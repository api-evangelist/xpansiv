    The Transfers APIs allow users to  take various actions, both read and write, for their bilateral
    transaction  activity. The Search Transfers API allows the user to search registry transfer data for
    their Xpansiv  Connect account and/or other Xpansiv Connect accounts that have granted your user that
    access. Note - this  call has a number of optional fields that the user needs to include if desired
    in the output.  The Create Transfers API allows the user to create new bilateral transfers. The Cancel
    Transfers API allows  the user to cancel/withdrawal any pending outgoing transfers. The Reject Transfers
    API allows the user to  reject any pending incoming transfer. The Accept Transfers API allows the
    user to accept any pending incoming transfer.

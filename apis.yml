aid: xpansiv
name: Xpansiv
description: Xpansiv is market infrastructure for global environmental and energy commodities — carbon
  credits, renewable energy certificates, water, low-carbon fuels and recycled materials. It operates
  CBL, the largest spot exchange for environmental commodities, the Evolution Markets and OTX brokerage
  and execution desks, the H2OX water market and the ACE and JSEV carbon platforms, alongside the environmental
  registries it acquired with APX in 2022 — NAR (North American Renewables Registry), TIGR, I-REC, I-TRACK-G
  and the Xpansiv-powered digital fuels registries. Its public developer portal at developer.xpansiv.com
  publishes eleven OpenAPI descriptions across Xpansiv Connect (environmental commodity portfolio, retirement
  and transfer), Xpansiv Managed Solutions, the NAR and TIGR registry client APIs, the Optimal Outcomes
  suite and the APX Power Markets file registry, plus a FIX 4.4 marketplace protocol specification, Xpansiv
  Data market-data APIs and a first-party Python SDK.
url: https://raw.githubusercontent.com/api-evangelist/xpansiv/refs/heads/main/apis.yml

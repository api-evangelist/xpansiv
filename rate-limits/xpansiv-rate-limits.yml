retry_guidance:
  published: false
  hazard: >-
    Retrying is not free on this catalog. Because no operation supports an idempotency
    key (see conventions/xpansiv-conventions.yml, idempotency.coverage: none), a blind
    retry after a 429 or a timeout on createRetirement, createTransfers, retire,
    initiateRetirements, deposit, withdraw or submitMeterReading risks executing the
    write twice against real environmental commodity instruments. Confirm state first —
    checkStatus, searchRetirements, searchTransfers, getOpenTransferBatches — then retry.

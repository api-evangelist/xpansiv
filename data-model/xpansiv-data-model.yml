  source: POST /retirements/account/{AccountIdentifier}/program/{RetirementProgramCode}/action/create
- from: Retirement
  to: RegistryRules
  type: belongs_to
  via: RetirementProgramCode
  source: GET /retirements/program/{RetirementProgramCode}/rules (getRegistryRules)
- from: Facility
  to: Meter
  type: has_many
  via: meter_id
  source: /facilities/{facility_id}/generation/meters/{meter_id}
- from: Meter
  to: MeterReading
  type: has_many
  via: meter_readings_id
  source: POST /facilities/{facility_id}/generation/meters/{meter_id}/readings
- from: Facility
  to: StateEligibility
  type: has_many
  via: facility_id
  source: GET /facilities/{facility_id}/state_eligibilities
- from: Facility
  to: Transaction
  type: has_many
  via: facility_id
  source: GET /facilities/{facility_id}/transactions
- from: Resource
  to: CookedForm
  type: has_one
  via: formCode
  source: GET /form/core/cooked/metadata/{formCode} (getCookedFormMetadata)
- from: Resource
  to: Issuance
  type: has_many
  via: resourceIdentifier / programAssignedIdentifier
  source: openapi/xpansiv-optimal-reporting-openapi.yml (ExtIssuancePublic,
    ExtResourcePublic)
- from: UsagePoint
  to: MeterReading
  type: has_many
  via: internalUsagePointCode / discriminatedUsagePointIdentifier
  source: openapi/xpansiv-optimal-telemetry-openapi.yml
- from: FileEntry
  to: FileType
  type: belongs_to
  via: fileTypeCode
  source: GET /api/fileType (getFileTypes), POST /api/file (addFileEntry)
- from: ScheduleFile
  to: ValidationStatus
  type: has_one
  via: fileHandle
  source: GET /fileRegistry/file/{fileHandle}/status (getStatus)
envelopes:
- name: OData-like row container
  schemas: [ODataEnvelopeWithTotalCountOfCounterparty, ODataEnvelopeWithTotalCountOfHolding,
    ODataEnvelopeWithTotalCountOfLedgerSubaccount, ODataEnvelopeWithTotalCountOfPendingTransfer,
    ODataEnvelopeOfCorporateEntities, ODataEnvelopeOfFileReport,
    ODataEnvelopeOfExtIssuancePublic, ODataEnvelopeOfExtResourcePublic]
  shape: '{ "@count": int, "value": [ ... ], "totalCount": int, "countExceeded": bool }'
  used_by: [NAR Registry, TIGRS Registry, Optimal File Registry, Optimal Reporting]
  note: The provider's own schema description calls this "Container for OData-like rows
    of information with count". Not OData.
- name: Request/Response container
  schemas: [RequestContainerOfRetireRequest, ResponseContainerOfRetireResponse,
    RequestContainerOfSubaccountCreateRequest, ResponseContainerOfSubaccountCreateResponse]
  used_by: [TIGRS Registry]
- name: Error container
  schemas: [ErrorContainer, ErrorItem, AbstractRestError, GeneralError, ValidationError,
    ServiceException, NotAuthorizedError, NotFoundError, InternalServerError,
    AuthTokenError]
  note: Ten distinct error schemas across the catalog and no shared one. See
    errors/xpansiv-problem-types.yml.

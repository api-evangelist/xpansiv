conformance:
- id: fix-4.4
  name: FIX Protocol 4.4 (FIX Trading Community)
  conforms: true
  domain_standard: true
  evidence: >-
    https://developer.xpansiv.com/developer-portal/marketplace/fix-api — "Xpansiv
    Marketplace Server API (rules of engagement) are based on FIX 4.4 specification and
    best practice guidelines as published by the FIX Trading Community. Unless
    specifically stated, field numbers, names, and data types are as published by the FIX
    specification." The page publishes the standard header (tag 8 BeginString, valid
    value FIX.4.4; 9 BodyLength; 35 MsgType; 49 SenderCompID; 56 TargetCompID), the
    supported administrative and application message set, and the three session types
    (Transaction, DropCopy, MarketData). Unsupported messages are rejected with
    BusinessMessageReject (35=j); malformed ones with a session-level Reject (35=3).
  note: >-
    This is the domain-standard signature for Xpansiv's market. A counterparty that
    already runs a FIX engine connects to CBL order entry and market data with no bespoke
    connector; one that does not needs a bilateral integration. The declaration is in the
    contract itself (tag numbers and message types), not in prose about the contract.
- id: oauth2-rfc6749
  name: OAuth 2.0 (RFC 6749) — resource owner password credentials grant
  conforms: true
  evidence: >-
    https://developer.xpansiv.com/developer-portal/xpansiv-power/rest_api/authentication
    links RFC 6749 §4.3.2 directly and documents POST to
    https://apxjwtauthprod.apx.com/oauth/token with Basic {client:secret},
    Content-Type application/x-www-form-urlencoded, grant_type=password, returning
    access_token / token_type / expires_in / scope. The same flow is documented for the
    NAR and TIGR registry client APIs.
- id: oauth2-auth0-password-realm
  name: OAuth 2.0 password-realm extension grant (Auth0)
  conforms: true
  evidence: >-
    https://developer.xpansiv.com/developer-portal/xpansiv-connect/getting-started —
    grant_type=http://auth0.com/oauth/grant-type/password-realm against
    https://auth.xpansiv.com/oauth/token with audience https://xpansiv/platform.
  note: A vendor extension grant, not a registered IETF grant type. Recorded as it is
    documented, and flagged as non-standard for an integrator's planning.

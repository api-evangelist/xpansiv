- id: odata
  name: OData
  conforms: false
  partial: true
  evidence: >-
    No $metadata surface, no $filter/$select/$expand query conventions and no
    OData-Version header, so this is not OData. But the NAR, TIGR and Optimal families do
    borrow the OData RESPONSE ENVELOPE and say so in their own schema descriptions —
    components.schemas.ODataEnvelopeWithTotalCountOfCounterparty (NAR) and
    ODataEnvelopeOfCorporateEntities (TIGR) are titled "Container for OData-like rows of
    information with count" and carry an "@count" integer alongside a "value" array,
    with totalCount and countExceeded on the NAR variant. Recorded as OData-shaped, not
    OData-conformant — a client cannot issue OData queries against these APIs.

  issue: >-
    components.securitySchemes is EMPTY and no security requirement is declared, on the
    Optimal description with the largest and most sensitive write surface (14 operations
    including initiateRetirements, initiateAccountTransfers and initiateSubaccountTransfers).
    The five sibling Optimal descriptions all declare the JWT bearer scheme. A reader of

method: searched
source: >-
  Derived from all 11 harvested OpenAPI descriptions, then upgraded from the four
  authentication pages Xpansiv publishes and the OIDC discovery documents that were
  fetched live.
docs:
- https://developer.xpansiv.com/developer-portal/xpansiv-connect/getting-started
- https://developer.xpansiv.com/developer-portal/xpansiv-data/authorization
- https://developer.xpansiv.com/developer-portal/xpansiv-managed-solutions/authorization

  - openapi/xpansiv-nar-registry-client-openapi.yml
  - openapi/xpansiv-optimal-file-registry-openapi.yml
  - openapi/xpansiv-optimal-reporting-openapi.yml
  - openapi/xpansiv-optimal-resource-openapi.yml
  - openapi/xpansiv-optimal-system-openapi.yml
  - openapi/xpansiv-optimal-telemetry-openapi.yml
- name: basicScheme
  type: http
  scheme: basic
  sources:
  - openapi/xpansiv-apx-power-markets-file-registry-openapi.yml
  note: >-
    The APX Power Markets description declares HTTP Basic as its scheme, but the
    authentication page documents Basic only on the TOKEN request; application endpoints
    take the resulting bearer JWT. The contract and the prose disagree; follow the prose.
- name: JWT
  type: apiKey
  in: header
  parameter: Authorization
  sources:
  - openapi/xpansiv-tigr-registry-client-openapi.yml
  note: Modelled as an apiKey in the Authorization header rather than as http/bearer.
    Functionally the same bearer JWT as the NAR description declares.
gaps:
- api: Transfer Position External API

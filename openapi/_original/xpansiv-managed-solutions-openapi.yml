        - $ref: '#/components/schemas/Error'
        - properties:
            error:
              description: >-
                403 when the caller lacks permission for the requested account
                or resource.
              type: string
              example: access_forbidden
            message:
              type: string
              example: You do not have permission to access this resource
          type: object
    AuthError:
      required:
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            error:
              description: 401 when API authentication is missing or invalid.
              type: string
              example: connection_failed
            message:
              type: string
              example: Authentication error
          type: object
    Error:
      description: >-
        Generic error payload when no more specific error schema applies.


        Implements JsonSerializable so it can be passed directly to
        API_Controller::response().

        Implements Countable returning 0 so the response size guard in
        API_Controller treats it

        as an empty collection (error responses never trigger the size limit).
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: error
        message:
          type: string
          example: Error description
      type: object
    MeterReadingOperationError:
      description: >-
        Shared `{success, error, message}` shape for meter-reading image/status
        API errors.


        Endpoint-specific schemas extend this class and set a distinct `schema`
        name for OpenAPI.
      required:
        - success
        - error
        - message
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: error
        message:
          description: Human-readable error message
          type: string
          example: An error occurred
      type: object
    ServerError:
      required:
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            error:
              description: 500 when an unexpected server or infrastructure failure occurs.
              type: string
              example: internal_error
            message:
              type: string
              example: Error description
          type: object
    ValidationError:
      description: >-
        Error payload for validation failures (400, 422) on request bodies and
        business rules.


        For query/path validation, see {@see
        \Trade\CodeIgniter\dtos\shared\responses\errors\QueryValidationErrorResponse}

        (`details` keyed by parameter name; this class uses `data` for the same
        purpose).
      properties:
        error:
          type: string
          example: validation_error
        message:
          type: string
          example: Errors when validating data
        data:
          type: object
          additionalProperties: true
      type: object
    QueryValidationErrorResponse:
      description: >-
        Generic 400 payload for query/path validation errors.


        Intended for read/query failures:

        - simple bad requests (`error` only, optional `message`)

        - field-level details via `details` (same role as `data` on {@see
        \Trade\CodeIgniter\dtos\shared\errors\ValidationError})
      properties:
        error:
          description: Error code or error message.
          type: string
          example: invalid_parameters
        message:
          description: Human-friendly explanation of the bad request.
          type: string
          example: >-
            One or more query parameters are invalid. Check details for
            field-specific messages.
          nullable: true
        details:
          description: Structured details keyed by query parameter/path.
          type: object
          example:
            status: 'Invalid value ''pending''. Allowed: active, inactive'
          nullable: true
          additionalProperties: true
      type: object
    MobileAppConfigResponse:
      description: Configuration used by the mobile app at startup.
      required:
        - features
        - user
        - limits
        - ocr
      properties:
        features:
          required:

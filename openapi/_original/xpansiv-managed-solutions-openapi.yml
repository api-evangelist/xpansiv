components:
  schemas:
    UpdateMemberPermissions:
      description: Replace the role assignments for an account member.
      required:
        - role_ids
      properties:
        role_ids:
          description: >-
            Role ids to assign. Must be a subset of {1, 2, 3} and must include
            role 1 (basic/view).
          type: array
          items:
            type: integer
          example:
            - 1
            - 2
      type: object
    AccountMember:
      description: An account member and their assigned roles.
      required:
        - membership_id
        - user_id
        - email
        - first_name
        - last_name
        - active
        - role_ids
      properties:
        membership_id:
          type: integer
          example: 555
        user_id:
          type: integer
          example: 42
        email:
          type: string
          format: email
          example: member@example.com
        first_name:
          type: string
          example: Jane
        last_name:
          type: string
          example: Doe
        active:
          type: boolean
          example: true
        role_ids:
          type: array
          items:
            type: integer
          example:
            - 1
            - 2
      type: object
    AccountMemberList:
      description: Members of an account and their role assignments.
      required:
        - members
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/AccountMember'
      type: object
    RemoveMemberResult:
      description: Result of removing a member from an account.
      required:
        - membership_id
        - removed
        - caller_active_account_id
      properties:
        membership_id:
          type: integer
          example: 555
        removed:
          type: boolean
          example: true
        caller_active_account_id:
          description: >-
            The authenticated caller's effective active account after removal
            (re-resolved if the caller removed themselves).
          type: integer
          example: 1001
      type: object
    UpdateAccountNameRequest:
      description: Partial account update payload. Phase 1 supports account_name only.
      required:
        - account_name
      properties:
        account_name:
          description: Trimmed display name for the account.
          type: string
          example: Acme Solar LLC
          maxLength: 50
      type: object
    AccountNameUpdateResponse:
      description: Updated account name fields returned in the API envelope `data` field.
      required:
        - account_id
        - account_name
        - account_modified
      properties:
        account_id:
          type: integer
          example: 4242
        account_name:
          type: string
          example: Acme Solar LLC
        account_modified:
          description: Last modification timestamp in ISO-8601 (Atom).
          type: string
          format: date-time
          example: '2024-06-01T14:30:00-04:00'
      type: object
    ApiKeyCreateRequestBody:
      required:
        - account_id
      properties:
        account_id:
          type: integer
          format: int64
      type: object
    ApiKeyCreatePayload:
      required:
        - api_access_id
        - account_id
        - token
        - active
        - created_date
      properties:
        api_access_id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        token:
          type: string
        active:
          type: boolean
        created_date:
          type: string
      type: object
    ApiKeyDeactivatePayload:
      required:
        - api_access_id
        - account_id
        - active
        - edited_date
      properties:
        api_access_id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        active:
          type: boolean
          example: false
        edited_date:
          type: string
          nullable: true
      type: object
    ApiKeyList:
      description: API key rows in the API envelope `data` field.
      type: array
      items:
        $ref: '#/components/schemas/ApiKeyListRow'
    ApiKeyListRow:
      required:
        - api_access_id
        - account_id
        - account_name
        - token
        - active
        - created_date
      properties:
        api_access_id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        account_name:
          type: string
        token:
          description: Always null on GET list.
          type: string
          nullable: true
        active:
          type: boolean
        created_date:
          type: string
        edited_date:
          type: string
          nullable: true
      type: object
    ApiKeyRotatePayload:
      required:
        - api_access_id
        - account_id
        - token
        - active
        - edited_date
      properties:
        api_access_id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        token:
          type: string
        active:
          type: boolean
        edited_date:
          type: string
          nullable: true
      type: object
    AuthTokenError:
      description: >-
        Error from auth token exchange or refresh (flat JSON, not the standard
        API envelope).
      required:
        - error
      properties:
        error:
          type: string
          example: Invalid or expired auth code
      type: object
    TokenExchangeRequest:
      description: >-
        Primary PWA clients send `application/x-www-form-urlencoded`. Mobile
        clients (`X-Client-Type: mobile`) may send the same field as JSON.
      required:
        - code
      properties:
        code:
          description: One-time key received from login redirect (32 characters).
          type: string
          example: thirty-two-characters-in-len-str
          maxLength: 32
          minLength: 32
      type: object
    TokenRefreshRequest:
      description: >-
        Optional body for mobile clients. PWA clients omit the body and send the
        refresh_token via an HTTP-only cookie.
      properties:
        refresh_token:
          description: Refresh token (mobile clients only).
          type: string
          maxLength: 32
          minLength: 32
      type: object
    AuthTokenResponse:
      description: >-
        JWT issued by auth token exchange or refresh. `refresh_token` is
        included for mobile clients only.
      required:
        - jwt
      properties:
        jwt:
          description: JWT token for authenticated API access
          type: string
          example: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          description: Rotated refresh token (mobile clients only).
          type: string
          nullable: true
          maxLength: 32
          minLength: 32
      type: object
    BuildingTypeItem:
      description: >-
        One building type row in the API envelope `data` array for
        `getBuildingTypes`.


        Runtime: {@see \Building_type_lib::get_building_types()} — `id`, `name`.
      required:
        - id
        - name
      properties:
        id:
          description: Primary key (`building_type_id`).
          type: integer
        name:
          description: Display name (`building_type_name`).
          type: string
      type: object
    BuildingTypesListResponse:
      description: Building type rows returned in the API envelope `data` field.
      type: array
      items:
        $ref: '#/components/schemas/BuildingTypeItem'
    CountriesListResponse:
      description: Country rows returned in the API envelope `data` field.
      type: array
      items:
        $ref: '#/components/schemas/Country'
    Country:
      description: One country row in the API envelope `data` array for `getCountries`.
      required:
        - country_id
        - country_name
      properties:
        country_id:
          description: Primary key (`country_id`).
          type: integer
        country_name:
          description: Display name (`country_name`).
          type: string
      type: object
    StateOption:
      description: One state or province option in the `getStatesByCountry` response.
      required:
        - code
        - name
      properties:
        code:
          description: Two-letter state or province code.
          type: string
        name:
          description: Display name.
          type: string
      type: object
    StatesByCountryResponse:
      description: Map of country_id (string key) to state/province options.
      type: object
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/StateOption'
    CreateAssetFieldErrors:
      description: >-
        Field-level validation messages in envelope `data` for `POST
        /ct/assets`.
      properties:
        asset_fse_id:
          type: string
          example: The asset_fse_id FSE12345EE6 already exists.
        reporting_method_id:
          type: string
          example: The reporting_method_id field is required.
        address_latitude:
          type: string
          example: >-
            The address_latitude value is not valid within United States limits.
            It should be within the range of 7.2 and 83.7.
        asset_serial_number:
          type: string
          example: The asset_serial_number field is required.
        entity_id:
          type: string
        asset_name:
          type: string
        address_street:
          type: string
        address_city:
          type: string
        address_zip:
          type: string
        address_state:
          type: string
        address_country:
          type: string
        address_longitude:
          type: string
        class_type_id:
          type: string
        charging_type_id:
          type: string
        manufacturer_name:
          type: string
        asset_registration_upload_id:
          type: string
        asset_start_date:
          type: string
        asset_end_date:
          type: string
        electricity_source_id:
          type: string
      type: object
    postAssetCreate:
      description: Request body for `POST /ct/assets` (`createAsset`).
      required:
        - entity_id
        - asset_name
        - address_street
        - address_city
        - address_zip
        - address_state
        - address_country
        - address_latitude
        - address_longitude
        - class_type_id
        - asset_serial_number
        - charging_type_id
        - manufacturer_name
        - asset_fse_id
        - asset_registration_upload_id
        - reporting_method_id
        - asset_start_date
        - asset_end_date
        - electricity_source_id
      properties:
        entity_id:
          description: Unique identifier for the entity
          type: string
          example: '150'
        asset_name:
          description: Name of the asset; can include dynamic placeholders
          type: string
          example: Test asset
        address_street:
          description: Street address of the asset
          type: string
          example: 40270 GLENALDER PLACE
        address_city:
          description: City where the asset is located
          type: string
          example: Squamish
        address_zip:
          description: ZIP or postal code
          type: string
          example: '12345'
        address_state:
          description: State or province
          type: string
          example: CA
        address_country:
          description: Country code (ISO format)
          type: string
          example: US
        address_latitude:
          description: Latitude coordinate; can include dynamic placeholders
          type: string
          example: '55.391234'
        address_longitude:
          description: Longitude coordinate; can include dynamic placeholders
          type: string
          example: '-92.75123'
        class_type_id:
          description: List of class type IDs associated with the asset
          type: array
          items:
            type: integer
          example:
            - 3
        asset_serial_number:
          description: Serial number for the asset; can include dynamic placeholders
          type: string
          example: '2025410189123'
        charging_type_id:
          description: Identifier for the charging type
          type: integer
          example: 3
        manufacturer_name:
          description: Name of the manufacturer
          type: string
          example: ABCD company
        asset_fse_id:
          description: FSE ID
          type: string
          example: FSE413000EE2
        asset_registration_upload_id:
          description: Unique registration upload ID; can include placeholders
          type: string
          example: RUZ-781234
        reporting_method_id:
          description: ID of the reporting method
          type: string
          example: '2'
        asset_start_date:
          description: Asset start date in YYYY-MM-DD format
          type: string
          format: date
          example: '2021-07-01'
        asset_end_date:
          description: Asset end date in YYYY-MM-DD format
          type: string
          format: date
          example: '2026-11-02'
        electricity_source_id:
          description: ID representing the source of electricity
          type: integer
          example: 3
        asset_status_id:
          description: Status ID of the asset
          type: string
          example: '4'
        asset_fse_code:
          description: Code representing the FSE
          type: string
          example: Test FSE code
        asset_method_of_kwh:
          description: Method used to measure kWh
          type: string
          example: akhdkajh
        asset_charging_data_source:
          description: Source of charging data
          type: string
          example: Test
        asset_lcfs_lff_id:
          description: LCFS (Low Carbon Fuel Standard) LFF ID
          type: string
          example: '1'
        asset_lcfs_facility_name:
          description: Name of the LCFS facility
          type: string
          example: test
        asset_rp_name:
          description: Reporting party or responsible person/entity name
          type: string
          example: test
      type: object
    CompanyEntityAddress:
      description: Address nested on a company entity returned by `getCompanyEntities`.
      properties:
        address_id:
          type: integer
          example: 18353
        address_street:
          type: string
          example: 1234 Shattuck Avenue
        address_city:
          type: string
          example: Berkeley
        address_zip:
          type: string
          example: '94704'
        address_state:
          type: string
          example: CA
        address_country:
          type: string
          example: US
      type: object
    CompanyEntityContact:
      description: Contact nested on a company entity returned by `getCompanyEntities`.
      properties:
        contact_id:
          type: string
          example: '12345'
        contact_name:
          type: string
          example: John Doe
        contact_email:
          type: string
          example: test.address@example.com
        contact_phone:
          type: string
          example: '123456789'
        contact_date_created:
          type: string
          example: '2024-10-26 13:30:24'
      type: object
    CompanyEntityItem:
      properties:
        address:
          $ref: '#/components/schemas/CompanyEntityAddress'
        contact:
          $ref: '#/components/schemas/CompanyEntityContact'
        entity_id:
          type: string
          example: '172'
        entity_name:
          type: string
          example: Example entity name
        entity_fein:
          type: string
          example: '123456789'
        entity_agreement:
          type: string
          example: 6363fac17cfaf0_1234567.pdf
      type: object
    CompanyEntityList:
      description: Company entity rows in the API envelope `data` field.
      type: array
      items:
        $ref: '#/components/schemas/CompanyEntityItem'
    CreateAssetSuccess:
      description: >-
        Success payload in the API envelope `data` field for `createAsset`
        (`POST /ct/assets`).
      required:
        - status
      properties:
        status:
          type: string
          example: asset created
      type: object
    FacilityCompleteError:
      description: >-
        Error payload for `POST /facilities/{facility_id}/complete`
        business-rule and validation failures.
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: error
        message:
          type: string
          example: Facility data validation failed.
        details:
          description: >-
            Optional structured context. Shape depends on the error: field
            validation map (`{ "field": "error message" }`), list of state codes
            (`["NJ"]`), or missing document slugs keyed by state (`{ "PA":
            ["schedule_a"] }`). Document slugs match `upload_field_name` from
            `GET /facilities/{facility_id}/state_eligibilities`.
          nullable: true
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: string
            - type: object
              additionalProperties:
                type: array
                items:
                  type: string
      type: object
    FacilityGetError:
      required:
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            error:
              description: >-
                GET `/facilities/{facility_id}` when the facility is missing or
                not visible to the account.
              type: string
              example: error
            message:
              type: string
              example: Wrong facility_id parameter
          type: object
    FacilityGetMissingIdError:
      required:
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            error:
              description: >-
                GET `/facilities/{facility_id}` when the path parameter is
                missing.
              type: string
              example: error
            message:
              type: string
              example: Missing facility_id parameter
          type: object
    MeterReadingEligibilityBadRequestError:
      description: >-
        `GET .../readings/eligibility` when facility or meter path IDs are
        invalid (manual contract).
      required:
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
    MeterReadingEligibilityServerError:
      description: >-
        `GET .../readings/eligibility` when an unexpected error occurs (manual
        contract).
      required:
        - can_submit
        - code
        - message
      properties:
        can_submit:
          type: boolean
          example: false
        code:
          type: string
          example: UNKNOWN
        message:
          type: string
          example: >-
            Error occurred while checking meter reading eligibility. Please try
            again later.
      type: object
    MeterReadingImageProcessingStatusBadRequestError:
      description: >-
        `GET .../image-readings/{processing_id}` when facility access or path
        validation fails (manual documents as 400).
      required:
        - success
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/MeterReadingOperationError'
    MeterReadingImageProcessingStatusNotFoundError:
      description: >-
        `GET .../image-readings/{processing_id}` when the processing record is
        missing or not owned by the facility.
      required:
        - success
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/MeterReadingOperationError'
        - properties:
            error:
              type: string
              example: invalid_processing_id
              enum:
                - invalid_processing_id
          type: object
    MeterReadingImageProcessingStatusServerError:
      description: >-
        `GET .../image-readings/{processing_id}` internal server error (manual
        contract).
      required:
        - success
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/MeterReadingOperationError'
    ProcessMeterReadingImageBadRequestError:
      description: >-
        `POST .../image-readings` client errors (missing/invalid image per
        manual spec).
      required:
        - success
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/MeterReadingOperationError'
        - properties:
            error:
              description: Error code indicating the type of validation failure
              type: string
              example: no_image
              enum:
                - no_image
                - invalid_image
            message:
              description: Human-readable error message
              type: string
              example: No image uploaded
          type: object
    ProcessMeterReadingImageMaxAttemptsError:
      description: >-
        `POST .../image-readings` when the photo OCR retry limit is reached
        (HTTP 429).
      required:
        - success
        - error
        - message
        - requires_manual_entry
        - remaining_attempts
      properties:
        success:
          type: boolean
          example: false
        error:
          description: Error code indicating the retry limit has been reached
          type: string
          example: max_photo_attempts_reached
          enum:
            - max_photo_attempts_reached
        message:
          description: Human-readable error message
          type: string
          example: Maximum photo submission attempts reached. Please use manual entry.
        requires_manual_entry:
          description: Always true when retry limit is reached
          type: boolean
          example: true
        remaining_attempts:
          description: Always 0 when retry limit is reached
          type: integer
          example: 0
          minimum: 0
      type: object
    ProcessMeterReadingImageServerError:
      description: '`POST .../image-readings` server failures after the image is accepted.'
      required:
        - success
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/MeterReadingOperationError'
        - properties:
            error:
              description: Error code indicating the type of server failure
              type: string
              example: image_upload_failed
              enum:
                - image_upload_failed
                - document_reference_missing
                - unexpected_error
            message:
              description: Human-readable error message
              type: string
              example: Image upload failed
          type: object
    ProductionHistoryBadRequestError:
      description: >-
        `GET .../generation/history` when generation data cannot be loaded
        (runtime returns 400).
      required:
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
    MeterReadingErrorResponse:
      description: >-
        Error response payload (inside the data envelope).


        The `error` and `errors` fields are optional and may not be present in
        all error responses.
      required:
        - success
        - message
      properties:
        success:
          description: Indicates if the submission was successful (always false for errors)
          type: boolean
          example: false
        error:
          description: Error code identifying the specific error type (optional)
          type: string
          example: VALIDATION_ERROR
          enum:
            - MULTIPLE_FACILITIES
            - NO_FACILITY
            - FIRST_TIME_SUBMISSION
            - CUMULATIVE_ONLY
            - AUTO_REPORTING
            - METER_NOT_VERIFIED
            - NEPOOL_REGISTRY
            - WREGIS_REGISTRY
            - NOT_ELIGIBLE
            - NO_METER
            - UNAUTHORIZED
            - INACTIVE_FACILITY
            - METER_ID_MISMATCH
            - VALIDATION_ERROR
            - OUTSIDE_EDIT_WINDOW
            - READING_NOT_FOUND
            - READING_METER_MISMATCH
        message:
          description: Human-readable error message (always present)
          type: string
          example: Reading falls outside of the accepted date range.
        errors:
          description: Field-specific validation errors (optional)
          type: object
          example:
            meter_reading: Reading is required
            meter_reading_date_taken: Reading date is required for cumulative meters
          additionalProperties:
            type: string
      type: object
    TransactionsForbiddenError:
      description: >-
        `GET .../transactions` when access is denied or the facility is
        closed/lost (manual 403).
      required:
        - error
        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
    TransactionsInvalidFacilityIdError:
      description: >-
        `GET .../transactions` when `facility_id` is not numeric (manual

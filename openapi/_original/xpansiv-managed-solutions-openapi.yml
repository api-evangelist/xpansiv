    ManualMeterReadingRequest:
      description: Manual meter reading submission body for `submitMeterReading`.
      required:
        - meter_reading
        - meter_reading_date_taken
      properties:
        meter_reading:
          description: The meter reading value provided by the user
          type: number
          example: 98765
          minimum: 0
        meter_reading_date_taken:
          description: >-
            Date when the meter reading was taken (YYYY-MM-DD). Required for
            cumulative meters.
          type: string
          format: date
          example: '2025-01-15'
      type: object
    ProcessMeterReadingImageRequest:
      description: >-
        Multipart body for `POST
        /facilities/{facility_id}/generation/meters/{meter_id}/image-readings`.
      required:
        - image
      properties:
        image:
          description: Meter reading photo
          type: string
          format: binary
        auto_submit_reading:
          description: Whether to automatically submit the reading after processing
          type: boolean
          default: false
        meter_reading_date_taken:
          description: >-
            Date when the meter reading was taken (required for cumulative
            meters)
          type: string
          format: date
          example: '2025-12-02'
      type: object
    StateCertificationInput:
      required:
        - state
        - state_certification_number
      properties:
        state:
          type: string
          example: PA
          maxLength: 2
        state_certification_number:
          type: string
          example: PA-1234567-SUN-I
      type: object
    UploadFacilityDocumentsRequest:
      required:
        - documents
      properties:
        state:
          description: >-
            Optional two-letter state abbreviation. When omitted, documents are
            matched to all eligible facility states.
          type: string
          example: OH
          maxLength: 2
        documents:
          type: array
          items:
            required:
              - document_name
              - document_content
            properties:
              document_name:
                description: >-
                  Required document slug from the facility state eligibility
                  response.
                type: string
                example: schedule_a
              document_content:
                description: Document file content.
                type: string
                format: binary
            type: object
          minItems: 1
      type: object
      example:
        state: OH
        documents:
          - document_name: photo_of_solar_meter
            document_content: file content
          - document_name: schedule_a
            document_content: file content
    postAbpInverterCreate:
      description: >-
        Inverter array entry for ABP facility creation
        (`facilityAbpFlatCreateOrUpdate.inverters`).
      required:
        - number_of_inverters
        - inverter_capacity_kw
        - inverter_manufacturer
        - inverter_model_type
        - inverter_efficiency
      properties:
        number_of_inverters:
          type: number
          example: 5
        inverter_capacity_kw:
          type: number
          example: 4.6
        inverter_manufacturer:
          type: string
          example: SunPower
        inverter_model_type:
          type: string
          example: SPR-4600 (4600W (208Vac) Utility Interactive Inverter)
        inverter_efficiency:
          description: Inverter efficiency percentage (e.g. `97.5`).
          type: number
          example: 97.5
      type: object
    postAbpPanelCreate:
      description: >-
        Panel array entry for ABP facility creation
        (`facilityAbpFlatCreateOrUpdate.panels`).
      required:
        - number_of_panels
        - panel_location
        - panel_rating_dc
        - panel_manufacturer
        - panel_model_type
        - tracking
        - array_tilt
        - array_orientation_azimuth
        - panels_bifacial
      properties:
        number_of_panels:
          type: number
          example: 20
        panel_location:
          type: string
          example: Roof
          enum:
            - Ground
            - Roof
        panel_rating_dc:
          description: Wattage of each module in W (DC).
          type: number
          example: 400
        panel_manufacturer:
          type: string
          example: Solartech Energy
        panel_model_type:
          type: string
          example: ASC-6M-72-295-3BB (295W Monocrystalline Module)
        tracking:
          type: string
          example: Fixed
          enum:
            - Fixed
            - '1'
            - '2'
        array_tilt:
          type: number
          example: 22
        array_orientation_azimuth:
          type: number
          example: 180
        panels_bifacial:
          description: Whether the panel array is bifacial.
          example: 0
          oneOf:
            - type: integer
              enum:
                - 0
                - 1
            - type: string
              enum:
                - '0'
                - '1'
            - type: boolean
      type: object
    facilityAddressInput:
      required:
        - street
        - city
        - county
        - state
        - zip
      properties:
        street:
          type: string
          example: 7312 Random Street
          maxLength: 80
        city:
          type: string
          example: Yorktown
          maxLength: 80
        county:
          type: string
          example: York County
          maxLength: 80
        state:
          type: string
          example: VA
        zip:
          type: string
          example: '23693'
        apartment:
          type: string
          maxLength: 80
      type: object
    postDggPanelCreate:
      description: >-
        Panel array entry for DGG facility creation
        (`facilityDggFlatCreateOrUpdate.panels`). `panel_location` is optional
        (unlike `panelFlatCreate`).
      required:
        - number_of_panels
        - panel_rating_dc
        - panel_manufacturer
        - panel_model_type
        - tracking
        - array_tilt
        - array_orientation_azimuth
      properties:
        number_of_panels:
          type: number
          example: 20
        panel_rating_dc:
          description: Wattage of each module in W (DC); up to 3 decimal places.
          type: number
          example: 400
        panel_manufacturer:
          type: string
          example: Solartech Energy
        panel_model_type:
          type: string
          example: ASC-6M-72-295-3BB (295W Monocrystalline Module)
        tracking:
          description: >-
            Fixed for stationary arrays; `1` single-axis tracking; `2` dual-axis
            tracking.
          type: string
          example: Fixed
          enum:
            - Fixed
            - '1'
            - '2'
        array_tilt:
          description: Degrees (0–90); numeric strings are accepted.
          type: number
          example: 22
        array_orientation_azimuth:
          description: Degrees (0–359.99); numeric strings are accepted.
          type: number
          example: 180
        panel_location:
          type: string
          example: Roof
          enum:
            - Ground
            - Roof
      type: object
    facilityInstallerInput:
      required:

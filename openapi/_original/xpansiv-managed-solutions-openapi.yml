      description: Returns transaction summary/history for a facility.
      operationId: getTransactionsHistory
      parameters:
        - name: facility_id
          in: path
          description: ID of the facility to retrieve transactions for
          required: true
          schema:
            type: integer
        - name: per_page
          in: query
          description: Number of transactions to display per page. Maximum 1000.
          required: false
          schema:
            type: integer
            default: 50
            maximum: 1000
            minimum: 1
        - name: page
          in: query
          description: The current page number
          required: false
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        '200':
          description: Transaction summary/history retrieved successfully
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/PaginatedResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 200
                    type: object
                  - $ref: '#/components/schemas/FacilityTransactionsPaginatedResponse'
        '400':
          description: Bad request - invalid facility ID format
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 400
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: >-
                          #/components/schemas/TransactionsInvalidFacilityIdError
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 401
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthError'
                    type: object
        '403':
          description: Access denied or facility closed/lost
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 403
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/TransactionsForbiddenError'
                    type: object
        '404':
          description: Facility not found
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 404
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/TransactionsNotFoundError'
                    type: object
  /facilities/{facility_id}/state_eligibilities:
    get:
      tags:
        - Facilities
      summary: State Eligibilities
      description: >-
        Retrieve state eligibility and required documents for a facility. For
        Illinois ABP, use the returned `documents[].upload_field_name` values as
        `document_name` when calling `POST /facilities/{id}/documents`. Required
        documents depend on facility attributes (e.g. `net_metering_approved`);
        always use this endpoint rather than a static slug list.
      operationId: getFacilityStateEligibilities
      parameters:
        - name: facility_id
          in: path
          description: The ID of the facility to fetch eligibility details for.
          required: true
          schema:
            type: integer
            example: 130240
      responses:
        '200':
          description: Successful response with state eligibility details.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 200
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/FacilityStateEligibilitiesList'
                    type: object
        '400':
          description: Bad Request - The request was invalid or cannot be otherwise served.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 400
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/FacilityGetMissingIdError'
                    type: object
        '404':
          description: Not Found - The requested facility was not found.
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 404
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/FacilityGetError'
                    type: object
  /facilities/{facility_id}/state_applications:
    post:
      tags:
        - Facilities
      summary: State Application
      description: Apply to a new state to be certified to generate RECs.
      operationId: createFacilityStateApplication
      parameters:
        - name: facility_id
          in: path
          description: The ID of the facility linked to the new application.
          required: true
          schema:
            type: integer
            example: 130240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFacilityStateApplicationRequest'
      responses:
        '200':
          description: State application created successfully for the given state
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 200
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/StateApplicationCreateData'
                    type: object
        '400':
          description: Bad request - authorization or validation errors
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 400
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/ValidationError'
                    type: object
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 500
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/ServerError'
                    type: object
  /facilities/{facility_id}/documents:
    post:
      tags:
        - Facilities
      summary: Facilities Documents
      description: >-
        Upload documents or photos for a facility (multipart form). Call `GET
        /facilities/{facility_id}/state_eligibilities` first to obtain each
        document's `upload_field_name` slug. For Illinois ABP, common slugs
        include `proof_of_irrevocable_transfer`, `proof_of_residential`, and
        `proof_of_site_control`; the eligibility response is authoritative.
      operationId: uploadFacilityDocuments
      parameters:
        - name: facility_id
          in: path
          description: The ID of the facility
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFacilityDocumentsRequest'
      responses:
        '200':
          description: Documents uploaded successfully
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 200
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/uploadFacilityDocumentsResponse'
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 401
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthError'
                    type: object
  /facilities/{facility_id}/state_certifications:
    post:
      tags:
        - Facilities
      summary: State Certifications
      description: >-
        Add state certificates to a facility. This endpoint is accessible for
        certain user only. If you want to use it, please contact Xpansiv Managed
        Solutions.
      operationId: addFacilityStateCertification
      parameters:
        - name: facility_id
          in: path
          description: The ID of the facility linked to the state certification.
          required: true
          schema:
            type: integer
            example: 130240
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFacilityStateCertificationRequest'
      responses:
        '200':
          description: State certification created successfully for the given state
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 200
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/StateCertificationCreateData'
                    type: object
        '400':
          description: Bad request - authorization or validation errors
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 400
                      elements:
                        type: integer
                        example: 0
                    type: object

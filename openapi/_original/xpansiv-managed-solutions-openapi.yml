        example: '2025-12-31'
    PaginatedSortedSearchQueryPage:
      name: page
      in: query
      description: 'Page number for pagination (default: 1)'
      required: false
      schema:
        type: integer
        example: 1
        minimum: 1
    PaginatedSortedSearchQueryPerPage:
      name: per_page
      in: query
      description: Number of items per page
      required: false
      schema:
        type: integer
        example: 20
        minimum: 1
    PaginatedSortedSearchQuerySortBy:
      name: sort_by[]
      in: query
      description: >-
        Sort keys as repeated query parameters. Each entry is `field` or
        `field:direction` (direction: ASC or DESC). Example:
        `sort_by[]=name:ASC&sort_by[]=id:DESC`
      required: false
      schema:
        type: array
        items:
          type: string
        example:
          - referrer_name:ASC

  /facilities/{facility_id}/generation/meters/{meter_id}/readings/{reading_id}:
    patch:
      tags:
        - Meter Readings
      summary: Update an Existing Meter Reading
      description: >-
        Partially update an existing meter reading for a facility.


        Updates are **always manual** — there is no automated/OCR path for this
        endpoint.

        The request body accepts the same fields as the manual submission:
        `meter_reading`

        and (for cumulative meters) `meter_reading_date_taken`.


        **Validation and business rules applied by the service layer**:

        - The user must have the `REPORT_PRODUCTION` ACL permission

        - `facility_id`, `meter_id`, and `reading_id` must be valid positive
        integers

        - The request body must be valid JSON

        - The reading must exist and belong to the specified meter
        (`READING_NOT_FOUND` / `READING_METER_MISMATCH`)

        - The reading must still be within the edit window
        (`OUTSIDE_EDIT_WINDOW`)

        - Field-level validation (e.g. required `meter_reading`, valid date
        format) is enforced
          and reported via the `errors` map in the response body
      operationId: updateMeterReading
      parameters:
        - name: facility_id
          in: path
          description: The unique identifier of the facility
          required: true
          schema:
            type: integer
            example: 12345
            minimum: 1
        - name: meter_id
          in: path
          description: The unique identifier of the meter
          required: true
          schema:
            type: integer
            example: 67890
            minimum: 1
        - name: reading_id
          in: path
          description: The unique identifier of the meter reading to update
          required: true
          schema:
            type: integer
            example: 54321
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualMeterReadingRequest'
      responses:
        '200':
          description: Meter reading updated successfully
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 200
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/MeterReadingSuccessResponse'
                    type: object
        '400':
          description: >-
            Bad Request. Possible `error` codes:

            - `invalid_parameters` (from controller) — one or more path IDs are
            not valid positive integers

            - `invalid_json` (from controller) — request body is not valid JSON

            - `submission_failed` (from service) — field-level validation
            failed; see `errors` map

            - `OUTSIDE_EDIT_WINDOW` — the reading has already been processed by
            the registry and can no longer be edited

            - `READING_NOT_FOUND` — reading does not exist

            - `READING_METER_MISMATCH` — reading does not belong to the given
            meter

            - `VALIDATION_ERROR` — general validation failure with field-level
            details in `errors`
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 400
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/MeterReadingErrorResponse'
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 401
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthError'
                    type: object
        '403':
          description: >-
            Forbidden. Possible `error` codes:

            - `permission_denied` — user lacks the `REPORT_PRODUCTION` ACL
            permission
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 403
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/MeterReadingErrorResponse'
                    type: object
        '500':
          description: Internal Server Error — unexpected exception during update
          content:

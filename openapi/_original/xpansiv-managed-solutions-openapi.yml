    AbpFacilityDetails:
      description: >-
        Facility detail for an Illinois Adjustable Block Program (ABP) system.
        Returned from `GET /facilities/{id}?data=all` when the facility has an
        ABP application. Program access: Illinois ABP via API is limited to
        authorized accounts; contact our support team to enroll.
      allOf:
        - $ref: '#/components/schemas/FacilityDetails'
        - $ref: '#/components/schemas/AbpFacilityDetailsFields'

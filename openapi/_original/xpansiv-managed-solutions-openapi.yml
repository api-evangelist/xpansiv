            - standard
        meter_serial_number:
          type: string
          example: '12345'
          maxLength: 50
        meter_remote_data_collector:
          type: string
          example: Enphase
        online_monitoring_api_id:
          type: string
          example: '123456'
        operation_start_date:
          description: >-
            Optional operation start date (YYYY-MM-DD or legacy date string

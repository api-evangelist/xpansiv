            - camera_scanning
            - manual_entry
            - image_upload
          properties:
            face_id:
              type: boolean
              example: true
            camera_scanning:
              type: boolean
              example: true
            manual_entry:
              type: boolean
              example: true
            image_upload:
              type: boolean
              example: true
          type: object
        user:

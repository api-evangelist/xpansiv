        `panelFlatCreate`).
      allOf:
        - $ref: '#/components/schemas/facilityFlatCreateOrUpdateCommonProperties'
        - $ref: '#/components/schemas/FacilityCreateDggFields'
    facilityFlatCreateOrUpdateCommonProperties:
      description: >-
        Shared JSON properties for standard facility create
        (`facilityFlatCreateOrUpdate`), California DGG create
        (`facilityDggFlatCreateOrUpdate`), and Illinois ABP create
        (`facilityAbpFlatCreateOrUpdate`). Each schema defines its own
        `required` list, `state` rules, installer vs owner contact requirements,
        and the `panels` / `inverters` item schema.
      properties:
        name:
          type: string
          example: Facility name
          maxLength: 80
        i_am_owner:
          description: >-
            Whether the submitter is the generation attribute owner (`0` / `1`;
            string forms are coerced).
          example: 1
          nullable: true
          oneOf:
            - type: integer
              enum:
                - 0
                - 1
            - type: string
              enum:
                - '0'
                - '1'
        i_have_solar_production_meter:
          example: 1
          nullable: true
          oneOf:
            - type: integer
              enum:
                - 0
                - 1
            - type: string
              enum:
                - '0'
                - '1'
        facility_type:
          description: |-
            Possible values are:
            - RES (Residential)
            - COM (Commercial)
            - MUNI (Municipal)
            - CMTY (Community Solar)
          type: string
          example: RES
          enum:
            - RES
            - COM
            - MUNI
            - CMTY
        facility_size:
          description: >-
            Facility DC capacity (DC kW). Minimum 0.000001; values are multiples
            of 0.000001.
          type: number
          example: 5.657
          minimum: 0.000001
        is_battery_backup:
          example: 1
          oneOf:
            - type: integer
              enum:
                - 0
                - 1
            - type: string
              enum:
                - '0'
                - '1'
          default: 0
        usable_energy:
          description: >-
            Required when `is_battery_backup` is `1`. Numeric strings are
            accepted.
          example: 2.36
          nullable: true
          oneOf:
            - type: number
              minimum: 0.000001
            - type: string
        street:
          type: string
          example: 7312 Random Street
          maxLength: 80
        apartment_suite:
          type: string
          maxLength: 80
        city:
          type: string
          example: Yorktown
          maxLength: 80
        county:
          type: string
          example: York County
          maxLength: 80
        zip:
          type: string
          example: '24567'
        system_leased:
          example: 0
          oneOf:
            - type: integer
              enum:
                - 0
                - 1
            - type: string
              enum:
                - '0'
                - '1'
          default: 0
        referrer_company:
          type: string
          example: Referrer company name
          maxLength: 100
        owner_first_name:
          type: string
          example: John
        owner_last_name:
          type: string
          example: Doe
        owner_company_name:
          type: string
          example: Owner company name
        owner_email:
          type: string
          example: owner@email.com
          maxLength: 100
        owner_street:
          type: string
          example: 7312 Random Street
          maxLength: 80
        owner_apartment_suite:
          type: string
          maxLength: 80
        owner_city:
          type: string
          example: Yorktown
          maxLength: 80
        owner_state:
          type: string
          example: VA
        owner_zip:
          type: string
          example: '23693'
        system_cost:
          description: >-
            Optional for DGG creates; required for standard create. Numeric
            strings are accepted.
          example: 12345
          nullable: true
          oneOf:
            - type: integer
              minimum: 1
            - type: string
        meter_manufacturer:
          type: string

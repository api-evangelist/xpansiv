        - message
      type: object
      allOf:
        - $ref: '#/components/schemas/Error'
        - properties:
            error:
              description: >-
                `GET .../transactions` when the facility is missing or
                transaction data cannot be loaded.
              type: string
              example: error
              enum:
                - error
                - facility_not_found
            message:
              type: string
              example: Facility not found
          type: object

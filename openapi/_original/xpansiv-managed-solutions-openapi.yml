      properties:
        company:
          type: string
          example: Installer company name
          maxLength: 100
        first_name:
          type: string
          example: John
          maxLength: 80
        last_name:
          type: string
          example: Doe
          maxLength: 80
        email:
          type: string
          example: contact@email.com
          maxLength: 100
        phone:
          type: string
          example: 123-123-1234
        address:

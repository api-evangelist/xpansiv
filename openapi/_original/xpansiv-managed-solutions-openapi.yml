        code:
          description: Status code when `can_submit` is false (null when eligible)
          type: string
          nullable: true
          enum:
            - MULTIPLE_FACILITIES
            - NO_FACILITY
            - FIRST_TIME_SUBMISSION
            - CUMULATIVE_ONLY
            - AUTO_REPORTING
            - METER_NOT_VERIFIED
            - NEPOOL_REGISTRY
            - WREGIS_REGISTRY
            - NOT_ELIGIBLE
            - NO_METER
            - OUTSIDE_SUBMISSION_WINDOW
        message:
          description: Human-readable message explaining submission status
          type: string
          nullable: true
      type: object
    MeterReadingImageExtractedData:
      description: OCR extracted data from the meter reading image
      required:
        - meter_brand
        - meter_model_number
        - meter_reading
        - raw_reading
        - is_valid
        - error_message
      properties:
        meter_brand:
          description: Extracted meter brand name
          type: string
          example: ''
        meter_model_number:
          description: Extracted meter model number
          type: string
          example: ''
        meter_reading:
          description: Extracted meter reading value
          type: string
          example: ''
        raw_reading:
          description: Raw OCR text before processing
          type: string
          example: ''
        is_valid:
          description: Whether the extracted reading is considered valid
          type: boolean
          example: false
        error_message:
          description: Error message if extraction failed or validation failed
          type: string
          example: ''
      type: object
    MeterReadingImageProcessingStatus:
      description: OCR processing status and extracted data
      required:
        - success
        - status
        - requires_manual_entry
        - remaining_attempts
        - extracted_data
      properties:
        extracted_data:
          $ref: '#/components/schemas/MeterReadingImageExtractedData'
        success:
          description: Whether the request was successful
          type: boolean
          example: true
        status:
          description: Current OCR processing status
          type: string
          example: processing
          enum:
            - pending
            - processing
            - successful
            - failed
        requires_manual_entry:
          description: >-
            Whether manual entry is required (true when status is failed and no
            remaining attempts)
          type: boolean
          example: false
        remaining_attempts:
          description: >-
            Number of remaining photo submission attempts before manual entry is
            required
          type: integer
          example: 5
          maximum: 5
          minimum: 0
      type: object
    MeterReadingLastSubmission:
      required:
        - meter_readings_id
        - generation_period
        - value
      properties:
        meter_readings_id:
          description: ID of the last meter reading submission
          type: integer
          example: 4728475
        generation_period:
          description: Period for which the last meter reading was submitted
          type: string
          example: 2025/09
        user_reading_taken:
          description: Date on which the user has taken the reading
          type: string
          format: date
          example: '2025-10-12'
          nullable: true
        value:
          description: Value of the last meter reading
          type: number
          example: 3701
      type: object
    MeterReadingSubmissionPeriod:
      required:
        - start
        - end
      properties:
        start:
          description: Start date of the submission period
          type: string
          format: date
          example: '2025-11-01'
        end:
          description: End date of the submission period
          type: string
          format: date
          example: '2025-11-02'
      type: object
    MeterReadingSubmissionWindow:
      properties:
        current_period:
          $ref: '#/components/schemas/MeterReadingSubmissionPeriod'
        next_period:
          $ref: '#/components/schemas/MeterReadingSubmissionPeriod'
      type: object
    ProcessMeterReadingImageSuccess:
      description: Image accepted for OCR processing.
      required:
        - success
        - message
        - processing_id
        - remaining_attempts
      properties:
        success:
          description: Indicates if the request was successful
          type: boolean
          example: true
        message:
          description: Human-readable success message
          type: string
          example: Meter readings processing started
        processing_id:
          description: Unique identifier for tracking the image processing status
          type: integer
          example: 16
        remaining_attempts:
          description: >-
            Number of remaining photo submission attempts before manual entry is
            required
          type: integer
          example: 4
          maximum: 5
          minimum: 0
      type: object
    ProductionHistoryData:
      description: >-
        Production history payload in the API envelope `data` field for
        `getProductionHistory`.
      required:
        - meter_id
        - meter_reading_style
        - current_reading_value
        - current_reading_status
        - current_reading_period

        - validation
      properties:
        success:
          type: boolean
          enum:
            - true
        facility_creation_attempt:
          type: object
          additionalProperties: true
        validation:
          description: May be an empty array [] or a ValidationErrorsMap object.
          oneOf:
            - type: array
              items:
                type: object
            - $ref: '#/components/schemas/ValidationErrorsMap'
      type: object
    UserListItem:
      required:
        - id
        - first_name
        - last_name

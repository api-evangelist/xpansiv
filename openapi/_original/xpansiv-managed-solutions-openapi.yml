          type: integer
          minimum: 1
        name:
          description: >-
            Display name; if omitted or whitespace-only, a unique generated name
            is used.
          type: string
        max_capacity_kw:
          description: >-
            Maximum total allowed sum of member nameplate kW for the group
            (enforced against `facility_size_kw` when adding members).
          type: number
          format: float
        facility_ids:
          description: >-
            Optional initial members as `facilities_id` values. Must belong to
            the API account. Duplicates and non-positive IDs are ignored.
          type: array
          items:
            type: integer
            minimum: 1
      type: object
    ManagedFacilityGroupWorkflowRequest:
      required:
        - group_ids
        - status
      properties:
        group_ids:
          description: >-
            Managed facility group IDs to transition (duplicates are ignored).
            Each entry may be a positive integer or numeric string.
          type: array
          items:
            oneOf:
              - type: integer
                example: 42
                minimum: 1
              - type: string
                pattern: ^[1-9][0-9]*$
                example: '42'
          example:
            - 7
            - 12
          minItems: 1
        status:
          description: >-
            Target workflow status. Must be the forward-only next step from each
            group's current status.
          type: string
          example: submitted
          enum:
            - admin_review
            - approved
            - complete
            - minted
            - submitted
      type: object

        limits:
          required:
            - max_image_size
            - max_image_dimension
          properties:
            max_image_size:
              description: >-
                Maximum image upload size in bytes. Environment overrides may be
                returned as strings.
              example: 10485760
              oneOf:
                - type: integer
                - type: string
            max_image_dimension:
              description: >-
                Maximum image dimension in pixels. Environment overrides may be
                returned as strings.
              example: 4096
              oneOf:
                - type: integer
                - type: string
          type: object
        ocr:
          required:
            - supported_formats
          properties:
            supported_formats:

      summary: Submit Meter Reading (Cumulative Meters Only)
      description: >-
        Submit a meter reading for a facility with a **cumulative meter only**.


        **Important**: This endpoint only accepts submissions for cumulative
        meters. Non-cumulative meters will be rejected with error code
        `CUMULATIVE_ONLY`.


        Supports both manual and automated submissions:

        - **Manual submission**: Provide `meter_reading` and
        `meter_reading_date_taken` (required for cumulative meters)

        - **Automated submission**: Provide `processing_id` to extract reading
        from automated processing system


        **Additional restrictions**:

        - First-time submissions are not allowed (at least one reading must
        already exist)

        - Meter must be verified and eligible for manual reading entry
      operationId: submitMeterReading
      parameters:
        - name: facility_id
          in: path
          description: The unique identifier of the facility
          required: true
          schema:
            type: integer
            example: 12345
            minimum: 1
        - name: meter_id
          in: path
          description: The unique identifier of the cumulative meter
          required: true
          schema:
            type: integer
            example: 67890
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:

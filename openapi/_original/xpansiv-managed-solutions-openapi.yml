  /facilities/{facility_id}/generation/meters/{meter_id}/readings/{meter_readings_id}/verification:
    post:
      tags:
        - Meter Readings
      summary: Submit Verification for a Held Meter Reading
      description: >-
        Upload a photo and a written description to justify a held meter reading
        (held generation).


        This endpoint is used when a reading has been flagged as needing user
        action (status

        `held_high`, `held_low`, `held_less_than_previous`, or
        `srectrade_disapproved`). A

        successful submission changes the reading status to `pending_review`.


        **Validation rules**:

        - `facility_id`, `meter_id`, and `meter_readings_id` must be positive
        integers

        - The authenticated user's account must have access to the facility

        - The facility must be active (not closed/lost)

        - The `meter_id` must be the primary meter of the facility

        - The reading must exist, belong to the meter, and have a status that
        requires user action

        - An image file must be provided (`image` field, `multipart/form-data`)

        - Accepted image types: `png`, `gif`, `jpg`, `jpeg` (extension and MIME
        type are both validated)

        - A non-empty `description` is required (max 512 characters)
      operationId: submitReadingVerification
      parameters:
        - name: facility_id
          in: path
          description: The unique identifier of the facility
          required: true
          schema:
            type: integer
            example: 12345
            minimum: 1
        - name: meter_id
          in: path
          description: The unique identifier of the primary meter of the facility
          required: true
          schema:
            type: integer
            example: 67890
            minimum: 1
        - name: meter_readings_id
          in: path
          description: The unique identifier of the held meter reading to verify
          required: true
          schema:
            type: integer
            example: 98765
            minimum: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - image
                - description
              properties:
                image:
                  description: >-
                    Photo justifying the meter reading. Accepted types: png,
                    gif, jpg, jpeg.
                  type: string
                  format: binary
                description:
                  description: >-
                    Written justification for the held reading (1–512
                    characters).
                  type: string
                  example: Meter was temporarily obstructed by construction equipment.
                  maxLength: 512
                  minLength: 1
              type: object
      responses:
        '201':
          description: Verification submitted — reading moved to `pending_review`
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 201
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/SubmitReadingVerificationSuccess'
                    type: object
        '400':
          description: '`NO_IMAGE` — the `image` field is absent from the request.'
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 400
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/ApiResponseDTO'
                    type: object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 401
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthError'
                    type: object
        '403':
          description: >-
            Forbidden. Possible `error` codes:

            - `permission_denied` — user lacks the `REPORT_PRODUCTION` ACL
            permission

            - `FACILITY_ACCESS_DENIED` — user's account cannot access this
            facility

            - `INACTIVE_FACILITY` — the facility has been closed/lost
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 403
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/ApiResponseDTO'
                    type: object
        '404':
          description: >-
            Not Found. Possible `error` codes:

            - `FACILITY_NOT_FOUND` — no facility exists for the given
            `facility_id`

            - `READING_NOT_FOUND` — reading does not exist or does not belong to
            the given meter
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 404
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/ApiResponseDTO'
                    type: object
        '409':
          description: >-
            Conflict — `READING_NOT_ELIGIBLE`. The reading exists but its
            current status does not

            require user action (e.g. it is already approved, pending review, or
            fully processed).
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 409
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/ApiResponseDTO'
                    type: object
        '422':
          description: >-
            Unprocessable Entity — request is well-formed but data validation
            failed. Possible `error` codes:

            - `invalid_parameters` — one or more path IDs are not valid positive
            integers

            - `METER_ID_MISMATCH` — `meter_id` is not the primary meter of the
            facility

            - `INVALID_IMAGE_TYPE` — image extension not in the allowed list
            (png, gif, jpg, jpeg)

            - `INVALID_IMAGE` — file MIME type does not match the declared
            extension

            - `INVALID_DESCRIPTION` — description is missing, empty, or exceeds
            512 characters
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 422
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/ApiResponseDTO'
                    type: object
        '500':
          description: >-
            Internal Server Error. Possible `error` codes:

            - `IMAGE_UPLOAD_FAILED` — the document storage service returned an
            error

            - `DOCUMENT_REFERENCE_MISSING` — the upload succeeded but returned
            no document reference

            - `UPDATE_FAILED` — the database update of the reading record failed
          content:
            application/json:
              schema:
                type: object
                allOf:
                  - $ref: '#/components/schemas/ResponseEnvelope'
                  - properties:
                      code:
                        type: integer
                        example: 500
                      elements:
                        type: integer
                        example: 0
                    type: object
                  - properties:
                      data:
                        $ref: '#/components/schemas/ApiResponseDTO'
                    type: object

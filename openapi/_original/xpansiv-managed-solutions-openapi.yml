        - tracking
        - array_tilt
        - array_orientation_azimuth
      properties:
        number_of_panels:
          type: number
          example: 5
        rating_dc:
          type: number
          example: 240
        manufacturer:
          type: string
          example: Solartech Energy
        model_type:
          type: string

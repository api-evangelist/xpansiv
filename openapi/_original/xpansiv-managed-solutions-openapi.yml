        operation_start:
          description: >-
            Optional operation start date (YYYY-MM-DD or legacy date string
            accepted by the server).
          type: string
          example: '2018-10-17'
        reading_at_interconnection:
          description: >-
            Often `0` for new interconnects; optional unless your program
            requires it.
          type: number

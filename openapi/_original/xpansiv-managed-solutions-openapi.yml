    ApiResponseDTO:
      description: API response data
      properties:
        success:
          type: boolean
          example: true
        error:
          type: string
          example: error message
        message:
          type: string
          example: message
        data:
          type: object
          example:
            key: value
        errors:
          type: array
          items:
            type: string
          example:
            - error message
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldError'
          example:
            - field: email
              message: error message
      type: object
    Pagination:
      properties:
        total:
          description: Total number of items
          type: integer
          example: 100
        per_page:
          description: Items per page
          type: integer
          example: 20
        current_page:

        $ref: '#/components/schemas/UserListItem'
    PaginatedResponseEnvelope:
      description: Standard API response envelope for paginated endpoints.
      type: object
      allOf:
        - $ref: '#/components/schemas/ResponseEnvelope'
        - required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/Pagination'
          type: object
    ResponseEnvelope:
      description: >-
        Standard API response envelope. Every response wraps its payload in this
        structure; the `data` field contains the operation-specific payload.
      required:
        - url
        - date
        - code
        - elements
        - page
      properties:
        url:
          description: Request URL including query string.
          type: string
          example: /app/api/v1/facilities
        date:
          description: Response timestamp.
          type: string
          example: 2024-09-17 04:26:39 EDT
        code:
          description: >-
            HTTP status code, mirrored in the JSON body (same as the response
            status).
          type: integer
        elements:
          description: Number of items in `data` on HTTP 200; 0 for other status codes.
          type: integer
        page:
          description: >-
            Page label (`1 of 1` when not paginated) or numeric page when
            listing with pagination.
          oneOf:
            - type: string
              example: 1 of 1
            - type: integer
              example: 2
      type: object

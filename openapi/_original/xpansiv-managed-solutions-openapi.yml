          type: string
          nullable: true
        pv_system_disclosure_form_id:
          description: Illinois PV System Disclosure Form identifier.
          type: string
          nullable: true
        rec_estimate_methodology:
          description: REC estimate methodology (`PVWATTS` or `CUSTOM_CAPACITY_FACTOR`).
          type: string
          nullable: true
        custom_capacity_factor:
          description: Custom capacity factor as a decimal.
          type: number
          format: float
          nullable: true
        custom_capacity_explanation:
          description: Explanation for a custom capacity factor.
          type: string
          nullable: true
        facility_energized:
          description: Whether the facility is energized.
          type: boolean
          nullable: true
        net_metering_approved:
          description: Whether net metering is approved.
          type: boolean
          nullable: true
        financial_structure:
          description: Financing structure (`Customer-owned`, `Lease`, or `PPA`).
          type: string
          nullable: true
        is_already_completed_project_app_on_the_same_parcel_of_land:
          description: Whether a prior project application exists on the same parcel.
          type: boolean
          nullable: true
        is_project_located_on_public_school_owned_land:
          description: Whether the site is on public school-owned land.
          type: boolean
          nullable: true
        ground_cover_ratio:
          description: Ground cover ratio.
          type: number
          format: float
          nullable: true
        prevailing_wage_subject:
          description: Prevailing wage applicability.
          type: boolean
          nullable: true
        minimal_shading_criteria:
          description: Whether minimal shading criteria are met.
          type: boolean
          nullable: true
        qualified_installer_person:
          description: Qualified installer contact name.
          type: string
          nullable: true
        construction_activities_completion_date:
          description: Construction completion date.
          type: string
          format: date
          nullable: true
        installer_demographics:
          oneOf:
            - $ref: '#/components/schemas/InstallerDemographics'

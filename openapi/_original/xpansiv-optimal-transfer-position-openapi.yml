openapi: 3.1.0
info:
  title: Transfer Position External API
  description: Use API credentials to view and manage instruments.
  version: 1.0.0
servers:
  - url: https://optimalapi-ext.apx.com/transfer/v1
  - url: https://optimalapi-uat-ext.apx.com/transfer/v1
tags:
  - name: transferbatch-v1
    description: >-
      Initiate a transfer request (between subaccounts or another account
      holder), view or act upon pending transfers, as well as view historical
      transfer details.
  - name: retirementbatch-v1
    description: >-
      View or submit a retirement request, or redemption claim, on
      instrument(s).
  - name: ledger-v1
    description: View an Account's current and historical instrument details
  - name: subaccount-v1
    description: >-
      View or create subaccounts. Use subaccounts to organize your account’s
      instruments. All accounts have a "Default" subaccount, where all new
      issuances and incoming transfers will be deposited. Subaccounts may also
      be used to delegate instrument management to an authorized third party.
paths:
  /api/ledger/{ledgerIdentifier}/transfer:
    post:
      tags:
        - transferbatch-v1
      summary: Initiate counterparty transfer
      description: >-
        Initiate transfer will propose the transaction to the counterparty,
        after which the counterparty will be prompted to act on the proposal.
      operationId: initiateAccountTransfers
      parameters:
        - name: ledgerIdentifier
          in: path
          description: Ledger identifier, can be found using /api/ledger endpoint
          required: true
          schema:
            type: string
            format: uuid
          example: 4b7375e9-79b0-4b8b-a89e-a21607f0239f
      requestBody:
        description: Bulk Transfer Request payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTransferRequest'
        required: true
      responses:
        '200':
          description: success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/BulkTransferResponse'
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractRestError'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GeneralError'
                  - $ref: '#/components/schemas/AbstractRestError'
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AbstractRestError'
        '404':
          description: Not Found
          content: {}
        '406':
          description: Not Acceptable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ErrorContainer'
        '422':
          description: Unprocessable Entity
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
        '500':
          description: Internal Server Error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'

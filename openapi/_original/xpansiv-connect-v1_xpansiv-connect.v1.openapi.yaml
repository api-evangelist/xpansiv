                  registryAssignedId:
                    type: string
    BaseInstrument:
      type: object
      required:
        - type
        - ein
        - program
        - vintage
        - creditType
      properties:
        type:
          $ref: '#/components/schemas/Ref.InstrumentType'
        id:
          type: integer
          format: int64
          description: Unique Xpansiv Connect identifier.
        ein:
          type: string
          description: >
            Environment Instrument Number. Unique identifier associated with an
            issuance of credits from a given project,  vintage, technology/fuel
            type and associated certification(s)/eligibility(s). An EIN is
            associated with a  position and a position will never be associated
            with more than 1 EIN.
        description:
          type: string
          description: >
            The Xpansiv Connect description associated with the instrument
            providing information regarding location,  vintage, fuel type and
            certifications.
        program:
          $ref: '#/components/schemas/Ref.Program'
        vintage:
          $ref: '#/components/schemas/Vintage'
        markets:
          type: array
          description: Optional property. Use `include` param.
          items:
            $ref: '#/components/schemas/InstrumentMarket'
        creditType:
          type: string
          description: The type of the credit.
      discriminator:
        propertyName: type
        mapping:
          CARBON: '#/components/schemas/CarbonInstrument'
          REC: '#/components/schemas/RecInstrument'
          RESOURCE_PROJECT: '#/components/schemas/ResourceInstrument'
    CarbonInstrument:
      allOf:
        - $ref: '#/components/schemas/BaseInstrument'
        - type: object
          required:
            - project
          properties:
            serialNumber:
              type: string
            issuanceCertifications:
              type: array
              description: Optional property. Use `include` param.
              items:
                $ref: '#/components/schemas/IssuanceCertification'
            projectCertifications:
              type: array
              description: Optional property. Use `include` param.
              items:
                $ref: '#/components/schemas/ProjectCertification'
            reportingPeriodStart:
              type: string
              format: date-time
              description: Reporting period start date.
            reportingPeriodEnd:
              type: string
              format: date-time
              description: Reporting period end date.
            project:
              $ref: '#/components/schemas/Project'
    RecInstrument:

                    type: object
                    required:
                      - transferIdentifier
                      - price
                    properties:
                      transferIdentifier:
                        type: string
                      externalTransferIdentifier:
                        type: string
                      price:
                        $ref: '#/components/schemas/Price'
      responses:
        '200':
          description: Transfers accepted successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                      - INVALID_PROGRAM
                      - INVALID_REQUEST
                      - EMPTY_REQUEST
                      - REQUEST_TOO_LARGE
                      - SETTLEMENT_DATE_IN_PAST
                      - SETTLEMENT_DATE_HOLIDAY
                      - SETTLEMENT_DATE_OUTSIDE_TRADING_WINDOW
                      - INCOMPLETE_M_RETS_BATCH
                      - INVALID_TRANSFERS
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - DUPLICATE_TRANSFER
                            - INVALID_TRANSFER
                            - INVALID_TRANSFER_PROGRAM
                            - INVALID_PRICE
                            - INVALID_TRANSFER_STATUS
                            - INVALID_TRANSFER_REGISTRY_STATUS
                        message:
                          type: string
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'

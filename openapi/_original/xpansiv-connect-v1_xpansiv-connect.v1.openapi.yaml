                  programName:
                    type: string
                  registryAssignedId:
                    type: string
            status:
              $ref: '#/components/schemas/Ref.ResourceProjectStatus'
            country:
              $ref: '#/components/schemas/Ref.Country'
            accountName:
              type: string
            classification1:
              type: string
            classification2:
              type: string
            classification3:
              type: string
            childResourceProject:
              $ref: '#/components/schemas/ChildResourceProject'
            inOutTypes:
              type: array
              items:
                type: object
                required:
                  - inType
                  - outType
                properties:
                  inType:
                    $ref: '#/components/schemas/Ref.ResourceInType'
                  outType:
                    $ref: '#/components/schemas/Ref.ResourceOutType'
            typeName:
              type: string
    ChildResourceProject:
      allOf:
        - $ref: '#/components/schemas/Resource'

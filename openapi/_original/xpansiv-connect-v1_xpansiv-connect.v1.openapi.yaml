                  type: boolean
                notes:
                  type: string
                transfers:
                  description: Transfer identifiers
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Transfers rejected successfully
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                      - INVALID_PROGRAM
                      - INVALID_REQUEST
                      - EMPTY_REQUEST
                      - REQUEST_TOO_LARGE
                      - INCOMPLETE_M_RETS_BATCH
                      - INVALID_TRANSFERS
                  message:
                    type: string
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                            - DUPLICATE_TRANSFER
                            - INVALID_TRANSFER
                            - INVALID_TRANSFER_PROGRAM
                            - INVALID_TRANSFER_STATUS
                            - INVALID_TRANSFER_REGISTRY_STATUS
                        message:
                          type: string
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
  /transfers/account/{AccountIdentifier}/program/{ProgramCode}/action/accept:

          properties:
            accountName:
              type: string
            inOutTypes:
              type: array
              items:
                type: object
                required:
                  - inType
                  - outType
                properties:
                  inType:
                    $ref: '#/components/schemas/Ref.ResourceInType'
                  outType:
                    $ref: '#/components/schemas/Ref.ResourceOutType'
            programs:
              type: array
              items:
                type: object
                title: ChildResourceProjectProgram
                required:
                  - program
                  - registryAssignedId
                properties:
                  program:
                    $ref: '#/components/schemas/Ref.ResourceProgram'
                  programName:

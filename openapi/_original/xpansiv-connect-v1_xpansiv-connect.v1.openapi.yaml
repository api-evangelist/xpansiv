  /forward-deals/account/{AccountIdentifier}/action/search:
    post:
      tags:
        - Forward Deals
      operationId: searchForwardDeals
      summary: Search forward deals
      parameters:
        - $ref: '#/components/parameters/AccountIdentifier'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Include'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                programs:
                  type: array
                  items:
                    $ref: '#/components/schemas/Ref.Program'
                lastUpdatedDateFrom:
                  type: string
                  format: date-time
                lastUpdatedDateTo:
                  type: string
                  format: date-time
                counterpartyName:
                  type: string
                  description: >-
                    If this search parameter is passed as ““  then deals with no
                    counterparty identifier specified will be returned.
                dealName:
                  type: string
      responses:
        '200':
          description: List of forward deals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Name of the forward deal.
                            memo:
                              type: string
                              description: Memo if provided by the XC user.
                            executionDate:
                              type: string
                              format: date-time
                              description: Execution date.
                            externalDealId:
                              type: string
                              description: Optional external ID.
                            type:
                              $ref: '#/components/schemas/Ref.ForwardDealType'
                            status:
                              $ref: '#/components/schemas/Ref.ForwardDealStatus'
                            transactionSideType:
                              $ref: '#/components/schemas/Ref.TransactionSideType'
                            program:
                              $ref: '#/components/schemas/Ref.Program'
                            vintageType:
                              $ref: '#/components/schemas/Ref.VintageType'
                            createdBy:
                              type: string
                              description: Created by id.
                            trader:
                              type: string
                              description: Trader name associated with the deal.
                            privateCounterpartyDetails:
                              type: object
                              properties:
                                contactName:
                                  type: string
                                  description: Optional contact name.
                                name:
                                  type: string
                                  description: Optional counterparty name.
                                tradeDate:
                                  type: string
                                  format: date-time
                                  description: Optional trade date.
                                contractNumber:
                                  type: string
                                  description: Optional contract number.
                            unitOfMeasure:
                              $ref: '#/components/schemas/Ref.UnitOfMeasure'
                            counterpartyName:
                              type: string
                              description: >-
                                Name of the counterparty in the registry for
                                this deal.
                            brokerDetails:
                              type: object
                              properties:
                                identifier:
                                  type: string
                                  description: Broker id.
                                name:
                                  type: string
                                  description: Broker name.
                                fee:
                                  allOf:
                                    - $ref: '#/components/schemas/Price'
                                  description: Broker fee.
                            lastUpdatedDate:
                              type: string
                              format: date-time
                              description: Last updated date.
                            forwardPortfolio:
                              type: object
                              properties:
                                identifier:
                                  type: string
                                name:
                                  type: string
                            confirmDetails:
                              type: object
                              properties:
                                comments:
                                  type: string
                                  description: >-
                                    Comments associated with the confirm action
                                    if provided by the XC client.
                                brokerInWriting:
                                  type: boolean
                                  description: >-
                                    Flag for if confirm was agreed with broker
                                    in writing.
                                receivedDate:
                                  type: string
                                  format: date-time
                                  description: Date the confirm was received.
                                executionDate:
                                  type: string
                                  format: date-time
                                  description: >-
                                    Date of deal execution related to this
                                    confirm action.
                            statusEvents:
                              type: array
                              items:
                                type: object
                                allOf:
                                  - $ref: '#/components/schemas/ForwardStatusEvent'
                                properties:
                                  type:
                                    $ref: '#/components/schemas/Ref.ForwardDealStatus'
                              description: Optional property. Use `include` param.
                            forwardTransactions:
                              type: array
                              items:
                                type: object
                                properties:
                                  identifier:
                                    type: string
                                    description: Unique identifier.
                                  deliveryDate:
                                    type: string
                                    format: date-time
                                    description: Schedule delivery date.
                                  quantity:
                                    type: integer
                                    format: int64
                                    description: Scheduled delivery quantity.
                                  quantityType:
                                    $ref: >-
                                      #/components/schemas/Ref.ForwardTransactionQuantityType
                                  status:
                                    $ref: >-
                                      #/components/schemas/Ref.ForwardTransactionStatus
                                  deliveryScheduleType:
                                    $ref: >-
                                      #/components/schemas/Ref.ForwardDeliveryScheduleType
                                  contractedDetails:
                                    $ref: '#/components/schemas/ForwardContract'
                                  deliveredDetails:
                                    $ref: '#/components/schemas/ForwardContract'
                                  netOpenVolume:
                                    type: integer
                                    format: int64
                                    description: Remaining open volume.
                                  createdDate:
                                    type: string
                                    format: date-time
                                    description: Delivery created date.
                                  lastUpdatedDate:
                                    type: string
                                    format: date-time
                                    description: Delivery last updated date.
                                  forwardInstrument:
                                    type: object
                                    properties:
                                      type:
                                        type: string
                                      deliveryDateRange:
                                        $ref: '#/components/schemas/ForwardDateRange'
                                    discriminator:
                                      propertyName: type
                                      mapping:
                                        BUNDLE: >-
                                          #/components/schemas/ForwardInstrumentAttributeBundle
                                        MMI: >-
                                          #/components/schemas/ForwardInstrumentMarketModelInstrument
                                    oneOf:
                                      - $ref: >-
                                          #/components/schemas/ForwardInstrumentAttributeBundle
                                      - $ref: >-
                                          #/components/schemas/ForwardInstrumentMarketModelInstrument
                                  deliveryNotes:
                                    type: string
                                  statusEvents:
                                    type: array
                                    items:
                                      type: object
                                      allOf:
                                        - $ref: '#/components/schemas/ForwardStatusEvent'
                                      properties:
                                        type:
                                          $ref: >-
                                            #/components/schemas/Ref.ForwardTransactionStatus
                                    description: >-
                                      Optional property. Use `include` param.
                                      Status event types.
                                  linkedTransfers:
                                    type: array
                                    items:
                                      type: string
                                    description: >
                                      Optional property. Use `include` param.
                                      Each value represents a transaction ID for
                                      the linked  transfer.
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                      - INVALID_REQUEST
                      - INVALID_PROGRAM
                      - INVALID_DATE_RANGE
                      - INVALID_PAGE_SIZE
                      - INVALID_PAGE_NUMBER
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/401'
        '500':
          $ref: '#/components/responses/500'
components:
  schemas:
    NotAuthorizedError:
      type: object
      properties:
        message:
          type: string
    NotFoundError:
      type: object
      properties:
        message:
          type: string
    InternalServerError:
      type: object
      properties:
        message:
          type: string
    Ref.CarbonProgram:
      type: string
      description: Ref.Data.CARBON_PROGRAM
    Ref.RegistryLinkStatus:
      type: string
      description: Ref.Data.REGISTRY_LINK_STATUS
    Ref.AccountStatus:
      type: string
      example: APPROVED
      description: Ref.Data.ACCOUNT_STATUS
    Ref.ServiceType:
      type: string
      description: Ref.Data.SERVICE_TYPE
    Ref.ServiceStatus:
      type: string
      description: Ref.Data.SERVICE_ACCOUNT_STATUS
    Ref.OrganizationLegalStructure:
      type: string
      example: PRIVATELY_OWNED_CORP
      description: Ref.Data.ORGANIZATION_LEGAL_STRUCTURE
    Ref.OrganizationType:
      type: string
      example: BROKER
      description: Ref.Data.ORGANIZATION_TYPE
    Ref.CustodianProgram:
      type: string
      description: Ref.Data.CUSTODIAN_PROGRAM
    Ref.Program:
      type: string
      description: Ref.Data.PROGRAM
    Ref.RecProgram:
      type: string
      description: Ref.Data.REC_PROGRAM
    Account:
      type: object
      required:
        - id
        - identifier
        - noOfUsers
        - status
        - maxUsers
        - childAccounts
        - registryLinks
        - organization
        - services
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        identifier:
          type: string
          readOnly: true
          example: 0980A123
        noOfUsers:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/Ref.AccountStatus'
        maxUsers:
          type: number
        childAccounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
        registryLinks:
          type: array
          items:
            $ref: '#/components/schemas/AccountRegistryLink'
        organization:
          $ref: '#/components/schemas/Organization'
        services:
          type: array
          description: >
            Service accounts for this EMA account. Each item is an
            `AccountService`
          items:
            $ref: '#/components/schemas/AccountService'
    AccountRegistryLink:
      type: object
      required:
        - id
        - program
        - registryAccountId
        - status
      properties:
        id:
          type: integer
          format: int64
        program:
          $ref: '#/components/schemas/Ref.Program'
        registryAccountId:
          type: string
        status:
          $ref: '#/components/schemas/Ref.RegistryLinkStatus'
        lastSyncDate:
          type: string
          format: date-time
          nullable: true
          description: >
            Incremental sync watermark (RFC 3339 date-time), equivalent to the
            server's sync time identifier used for incremental sync. Omitted or
            null when the registry link has never been synced.
    Organization:
      type: object
      required:
        - legalName
        - structure
        - type
      properties:
        iamOrgId:
          type: string
        legalName:
          type: string
          example: RVCMC Sub Default
        structure:
          $ref: '#/components/schemas/Ref.OrganizationLegalStructure'
        type:
          $ref: '#/components/schemas/Ref.OrganizationType'
    AccountService:
      type: object
      description: >
        Canonical account service response (`id`, `status`, `type`, optional
        `attributes`). Used on `Account.services` and on standalone
        service-account endpoints. Polymorphism is on `attributes`, selected
        implicitly by `type`. If the service has no typed attributes (any `type`
        other than ACX, SUBACCOUNT_SERVICE, or CUSTODIAN_SERVICE), do not
        display `attributes` — omit the field, or return it as an empty object.
      required:
        - id
        - status
        - type
      properties:
        id:
          type: integer
          readOnly: true
        status:
          type: string
          description: Ref.Data.SERVICE_ACCOUNT_STATUS
          example: APPROVED
          readOnly: true
        type:
          type: string
          example: ACX
          description: Ref.Data.SERVICE_TYPE
        attributes:
          $ref: '#/components/schemas/AccountServiceAttributes'
    AccountServiceAttributes:
      title: AccountServiceAttributes
      description: >
        Shape is determined by the parent service `type` (Ref.ServiceType),
        using mapping: ACX → AcxAccountServiceAttributes; SUBACCOUNT_SERVICE →
        SubaccountAccountServiceAttributes; CUSTODIAN_SERVICE →
        CustodianAccountServiceAttributes. If there are no service attributes
        (all other service types), do not display this object — omit
        `attributes`, or return `attributes` as an empty object.
      oneOf:
        - $ref: '#/components/schemas/AcxAccountServiceAttributes'
        - $ref: '#/components/schemas/SubaccountAccountServiceAttributes'
        - $ref: '#/components/schemas/CustodianAccountServiceAttributes'
    AcxAccountServiceAttributes:
      title: AcxAccountServiceAttributes
      type: object
      description: |
        Attributes for account service with `type` ACX.
      required:
        - acxAccountIdentifier
      properties:
        acxAccountIdentifier:
          type: string
    RetirementSubaccountCode:
      type: object
      description: List of retirement subaccounts
      properties:
        enabled:
          type: boolean
          description: If true subaccount is enabled
        code:
          type: string
          description: Subaccount code
        name:
          type: string
          description: Subaccount name
      required:
        - code
        - enabled
    SubaccountAccountServiceAttributes:
      title: SubaccountAccountServiceAttributes
      type: object
      description: |
        Attributes for account service with `type` SUBACCOUNT_SERVICE.
      required:
        - custodianEmaAccountIdentifier
        - autoDeposit
      properties:
        custodianEmaAccountIdentifier:
          type: string
          description: The EMA account identifier of the custodian account
        autoDeposit:
          type: boolean
          description: If set true - auto deposit mode will be enabled
        retirementSubaccountCodes:
          type: object
          description: >-
            Mapping of a program code to a list of retirement subaccounts.
            Program codes are taken from ReferenceData.Program
          additionalProperties:
            type: array
            items:
              type: string
          example:
            ACR:
              - '12345'
            CAR: []
            VCS:
              - '43134'
              - '32141'
        linkedRegistryAccountIds:
          type: object
          description: >-
            Mapping of a program code to a registry account id. Program codes
            are taken from ReferenceData.Program
          additionalProperties:
            type: string
            description: Registry account id
          example:
            ACR: '098765'
            CAR: null
            VCS: '567890'
    CustodianAccountServiceAttributes:
      title: CustodianAccountServiceAttributes
      type: object
      description: |
        Attributes for account service with `type` CUSTODIAN_SERVICE.
      required:
        - custodianProgramCode
        - manualReplicaMode
        - externalTransferAutoApproval
      properties:
        custodianProgramCode:
          $ref: '#/components/schemas/Ref.CustodianProgram'
        manualReplicaMode:
          type: boolean
          description: if set true - manual replica mode will be enabled
        ledgerCode:
          type: string
        ledgerIdentifier:
          type: string
        accountHoldingsIdentifier:
          type: string
          description: account identifier on custodian program
        accountHoldingsName:
          type: string
          description: account name on custodian program
        replicaTargetSubaccountIdentifier:
          type: string
          description: default subaccount identifier to propagate replicas to
        externalTransferAutoApproval:
          type: boolean
        retirementOperationsNotificationEmails:
          type: array
          description: >-
            Optional addresses that receive a copy of retirement notifications,
            merged with user-supplied email.
          items:
            type: string
    Page:
      type: object
      required:
        - page
        - size
        - totalPages
        - totalElements
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
    Location:
      title: Resource location
      type: object
      properties:
        latitude:
          type: number
          format: double
          description: Latitude.
        longitude:
          type: number
          format: double
          description: Longitude.
    Ref.ExecutionVenue:
      type: string
      description: Ref.Data.EXECUTION_VENUE
    Ref.Currency:
      description: Ref.Data.CURRENCY
      type: string
      minLength: 3
      example: USD
    Ref.Country:
      type: string
      description: Ref.Data.COUNTRY
    Ref.FuelType:
      type: string
      description: Ref.Data.REC_FUEL_TYPE
    Ref.StateProvince:
      type: string
      description: Ref.Data.STATE_PROVINCE
    Ref.Certification:
      type: string
      description: Certification code. Ref.Data.CARBON_CERTIFICATION
    Ref.CreditType:
      type: string
      description: The type of the credit. Ref.Data.CARBON_CREDIT_TYPE
    Ref.ProjectType:
      type: string
      description: The project type. Ref.Data.CARBON_PROJECT_TYPE
    Ref.BaselineMethodology:
      type: string
      description: Ref.Data.BASELINE_METHODOLOGY
    Ref.GeneratorStatus:
      type: string
      description: The status of the generator in the registry. Ref.Data.GENERATOR_STATUS
    Ref.ForwardDealStatus:
      type: string
      description: Ref.Data.FORWARD_DEAL_STATUS
    Ref.TransactionSideType:
      type: string
      description: Buy or Sell. Ref.Data.FORWARD_DEAL_TRANSACTION_TYPE
    Ref.VintageType:
      type: string
      description: Ref.Data.FORWARD_DEAL_VINTAGE_TYPE
    Ref.UnitOfMeasure:
      type: string
      description: Unit of measure. Ref.Data.UNIT_OF_MEASURE
    Ref.ForwardTransactionQuantityType:
      type: string
      description: Quantity type. Ref.Data.FORWARD_DEAL_QUANTITY_TYPE
    Ref.ForwardTransactionStatus:
      type: string
      description: Delivery status. Ref.Data.FORWARD_DEAL_TRANSACTION_STATUS
    Ref.ForwardDeliveryScheduleType:
      type: string
      description: Delivery schedule type. Ref.Data.FORWARD_DEAL_DELIVERY_SCHEDULE_TYPE
    Ref.ResourceInType:
      type: string
      description: Ref.Data.RESOURCE_INPUT_TYPE
    Ref.ResourceOutType:
      type: string
      description: Ref.Data.RESOURCE_OUTPUT_TYPE
    Ref.InstrumentType:
      type: string
      description: REC or CARBON. Ref.Data.INSTRUMENT_TYPE
    Ref.SubAccountType:
      type: string
      description: Type of registry sub-account. Ref.Data.SUBACCOUNT_REGISTRY_TYPE
    Ref.ComplianceStatus:
      type: string
      description: >-
        Flag for whether sub-account is for compliance retirement activity.
        Ref.Data.COMPLIANCE_STATUS
    Ref.WithdrawStatus:
      type: string
      description: Status of the deposit withdrawal request. Ref.Data.WITHDRAW_STATUS
    Ref.ForwardDealType:
      type: string
      default: PHYSICAL
      description: >-
        Type of deal as either Market or Project Specific.
        Ref.Data.FORWARD_DEAL_TYPE
    Ref.TaxLotSelectionStrategy:
      type: string
      description: Ref.Data.TAX_LOT_SELECTION_STRATEGY
    Ref.ProjectRegistryStatus:
      type: string
      description: The registry status of the project. Ref.Data.PROJECT_REGISTRY_STATUS
    Price:
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          $ref: '#/components/schemas/Ref.Currency'
        amount:
          type: number
          description: The numeric value of the price
          minimum: 0
    Vintage:
      type: object
      required:
        - year
      properties:
        year:
          type: integer
          format: int32
          description: Vintage year.
        month:
          type: integer
          format: int32
          description: Vintage month.
    Position:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: >-
            The unique identifier for the position in the portfolio. A postion
            is made up of 1 or more Tax Lots.
        tags:
          type: array
          description: >-
            The name of the tag(s), if used, that are associated with the
            position.
          items:
            type: string
        taxLots:
          type: array
          items:
            $ref: '#/components/schemas/TaxLot'
        instrument:
          $ref: '#/components/schemas/Instrument'
    TaxLot:
      type: object
      description: >-
        A Tax Lot represents the incoming activity that resulted in the creation
        or increase of a position against an EIN. The types of activities
        represented by Tax Lots are; imported positions (at account linking);
        incoming settled bilateral transfers; or credit issuance. Tax Lot is
        associated with a Position, where 1 or more Tax Lots make up the
        available quantity for a single Position
      properties:
        id:
          type: integer
          format: int64
          description: The unique identifier for the tax lot
        name:
          type: string
          description: >-
            The name of the tax lot, normally made up of tax lot type and
            established date
        establishedDate:
          type: string
          format: date-time
          description: >-
            The timestamp for when the tax lot was established, meaning when the
            transaction that created the tax lot was accepted in XC
        establishQuantity:
          type: integer
          format: int64
          description: >-
            The original quantity of credits that created the tax lot. Optional
            property. Use `include` param.
        pricePaid:
          $ref: '#/components/schemas/Price'
        availableQuantity:
          type: integer
          format: int64
          description: The quantity available of the tax lot for transfer or retirement
        encumberedQuantity:
          type: integer
          format: int64
          description: >-
            The quantity encumbered of the tax lot on an execution venue
            integrated with XC
        unsettledQuantity:
          type: integer
          format: int64
          description: >-
            The quantity unsettled of the tax lot. This can represent a quantity
            that is in a bilateral transaction, buy or sell, that is pending and
            not yet settled in the registry.
        estimatedMarketPrice:
          type: number
          description: >-
            The estimated price associated with the highest value market this
            tax lot has a certification with  where prices have been uploaded
            from the CBL Exchange. Optional property. Use `include` param.
        estimatedMarketValue:
          type: number
          description: >-
            Using the Estimated Market Price, this represents the estimated
            market value of the tax lot based on the tax lot position quantity.
            Optional property. Use `include` param.
        estimatedGainLoss:
          type: number
          description: >-
            Utilizing both Price Paid and Estimated Market Price against tax lot
            quantity to determine if there was a financial gain or loss for this
            tax lot. Optional property. Use `include` param.
        previousCounterparty:
          type: string
          description: >-
            The registry name of the counterparty that transferred the credits
            of this tax lot to the XC client. Optional property. Use `include`
            param.
        externalTradeId:
          type: string
          description: >-
            An external trade/transaction identifier as provided by the XC
            client for this position. Optional property. Use `include` param.
        dealId:
          type: string
          description: >-
            A deal Identifier as provided by the XC client for this position if
            associated with a forward deal delivery. Optional property. Use
            `include` param.
    Retirement:
      type: object
      required:
        - instrument
        - lastUpdatedDate
        - createdDate
        - quantity
        - status
        - batchIdentifier
        - identifier
      properties:
        instrument:
          $ref: '#/components/schemas/Instrument'
        lastUpdatedDate:
          type: string
          format: date-time
          description: Last updated date.
        createdDate:
          type: string
          format: date-time
          description: Creation date.
        quantity:
          type: integer
          description: Retirement quantity.
        status:
          $ref: '#/components/schemas/Ref.RetirementStatus'
        batchIdentifier:
          type: string
          description: XPC Retirement batch identifier
        identifier:
          type: string
          description: XPC Retirement identifier
        externalIdentifier:
          type: string
          description: >-
            Retirement identifier provided by API client when creating the
            retirement
        registryTransferIdentifier:
          type: string
          description: Retirement identifier generated by the program
        registryPositionId:
          type: string
          description: Id of the retired registry credits
        attributes:
          type: object
          additionalProperties: true
        transferTaxLots:
          description: Optional property. Use `include` param.
          type: array
          items:
            type: object
            required:
              - taxLot
            properties:
              taxLot:
                $ref: '#/components/schemas/TaxLot'
              quantity:
                type: integer
                format: int64
    Ref.RetirementProgramCode:
      type: string
      description: Retirement program code. Ref.Data.RETIREMENT_PROGRAM
    Ref.RetirementStatus:
      type: string
      description: Status of the retirement. Ref.Data.RETIREMENT_STATUS
    Resource:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          format: int64
          description: The unique XC db identifier for the project or generator.
        upn:
          type: string
          description: >
            Universal Project Identifier. The unique identifier assigned by
            Xpansiv Connect to every resource across all registries that  have
            integrated with the Xpansiv Connect platform.
        name:
          type: string
          description: The registry assigned name of the project or generator.
    Ref.ResourceProgram:
      type: string
      description: Ref.Data.RESOURCE_PROGRAM
    Ref.ResourceProjectStatus:
      type: string
      description: Ref.Data.RESOURCE_PROJECT_STATUS
    AccountHolder:
      type: object
      required:
        - registryAccountId
        - registryAccountName
        - program
        - active
      properties:
        registryAccountId:
          type: string
          description: ID of the account on the registry.
        registryAccountName:
          type: string
          description: Name of the account on the registry.
        program:
          $ref: '#/components/schemas/Ref.Program'
        accountType:
          type: string
          description: Account type description.
        managerName:
          type: string
          description: Name of the manager.
        active:
          type: boolean
          description: True/False.
        generatorAccount:
          type: boolean
          description: True/False.
    Generator:
      allOf:
        - $ref: '#/components/schemas/Resource'
        - type: object
          properties:
            program:
              $ref: '#/components/schemas/Ref.RecProgram'
            registryAssignedId:
              type: string
              description: The registry assigned identifier for the generator.
            status:
              $ref: '#/components/schemas/Ref.GeneratorStatus'
            siteCode:
              type: string
              description: The Site Code of the generator if provided by the registry.
            unitName:
              type: string
              description: The Unit Name of the generator in the registry.
            controlArea:
              type: string
              description: The Control Area that the generator is located in.
            parentCompanyName:
              type: string
              description: >-
                The Parent Company Name of the generator if provided by the
                registry.
            powerCompanyName:
              type: string
              description: >-
                The Power Company Name of the generator if provided by the
                registry.
            powerCompanyCode:
              type: string
              description: >-
                The Power Company Code of the generator if provided by the
                registry.
            ownerName:
              type: string
              description: The Owner Name of the generator if provided by the registry
            ownershipType:
              type: string
              description: The Ownership Type of the generator if provided by the registry.
            countyName:
              type: string
              description: >-
                The County Name locatio of the generator if provided by the
                registry.
            stateProvince:
              $ref: '#/components/schemas/Ref.StateProvince'
            country:
              $ref: '#/components/schemas/Ref.Country'
            contactInfo:
              type: string
              description: >-
                Contact Information for the generator if provided by the
                registry.
            registryAcctHolderName:
              type: string
              description: >-
                The Registry Account Holder name of the generator if provided by
                the registry.
            commencedDt:
              type: string
              format: date-time
              description: >-
                The Commenced Operation Date of the generator if provided by the
                registry.
            nameplateCapacity:
              type: number
              format: double
              description: >-
                The Nameplate Capacity of the generator if provided by the
                registry.
            facNoncompetitiveCertData:
              type: string
            fuelTypes:
              type: array
              description: >-
                Additional information about a generator if it is multi-fuel.
                Optional property. Use `include` param.
              items:
                title: Fuel Type Eligibility aggregation
                type: object
                required:
                  - fuelType
                properties:
                  fuelType:
                    $ref: '#/components/schemas/FuelType'
                  stateEligibilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/StateEligibility'
                  voluntaryEligibilities:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoluntaryEligibility'
    FuelType:
      type: object
      properties:
        name:
          type: string
          description: The fuel type associated with the underlying asset.
        type:

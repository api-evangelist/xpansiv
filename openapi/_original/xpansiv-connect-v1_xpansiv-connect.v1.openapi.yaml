            stateEligibilities:
              type: array
              description: Optional property. Use `include` param.
              items:
                type: object
                description: >-
                  Object to hold full state eligibility information - type of
                  eligibility and name
                properties:
                  name:
                    type: string
                    description: Name of the state eligibility.
                  type:
                    $ref: '#/components/schemas/Ref.StateEligibilityType'
            voluntaryEligibilities:
              type: array
              description: Optional property. Use `include` param.

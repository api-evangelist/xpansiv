    FacilityAbpFields:
      description: Illinois Adjustable Block Program (ABP) fields. Required when creating an ABP facility (`address.state` is `IL` and your account is ABP-enabled). See nested `panels[].bifacial` and `inverters[].efficiency` on the parent schema.
      properties:
        installer_demographics:
          oneOf:
          - $ref: '#/components/schemas/InstallerDemographics'
          description: Installer workforce demographics required for Illinois ABP applications.
        existing_project_application_id:
          description: ABP application ID when this facility is an expansion of an existing project on the same parcel.
          type: string
          example: ABP-12345
          maxLength: 20
        pv_system_disclosure_form_id:
          description: Illinois PV System Disclosure Form identifier.
          type: string
          example: '12345'
        custom_capacity_factor:
          description: Custom capacity factor as a decimal (e.g. `0.1426` for 14.26%). Required when `rec_estimate_methodology` is `CUSTOM_CAPACITY_FACTOR`. Do not send a percentage scaled to 100.
          type: number
          format: float
          example: 0.1426
        custom_capacity_explanation:
          description: Narrative explaining the custom capacity factor when `rec_estimate_methodology` is `CUSTOM_CAPACITY_FACTOR`.
          type: string
        icc_docket_number:
          description: Illinois Commerce Commission docket number when applicable.
          type: string
        facility_energized:
          description: Whether the facility has been energized / received permission to operate.
          type: boolean
          example: true
        net_metering_approved:
          description: Whether net metering has been approved. Drives which net-metering-related documents appear in `GET /facilities/{id}/state_eligibilities`.
          type: boolean
          example: true
        install_contract_exec_date:
          description: Installation contract execution date (`YYYY-MM-DD`).
          type: string
          format: date
          example: '2025-06-01'
        financial_structure:
          description: How the system is financed. PPA is common for leased portfolio operators.
          type: string
          example: PPA
          enum:
          - Customer-owned
          - Lease
          - PPA
        is_already_completed_project_app_on_the_same_parcel_of_land:
          description: Whether a project application was already completed on the same parcel of land.
          type: boolean
          example: false
        is_project_located_on_public_school_owned_land:
          description: Whether the project is located on public school-owned land.
          type: boolean
          example: false
        rec_estimate_methodology:
          description: Method used to estimate REC production. Use `CUSTOM_CAPACITY_FACTOR` when supplying `custom_capacity_factor`.
          type: string
          example: CUSTOM_CAPACITY_FACTOR
          enum:
          - PVWATTS
          - CUSTOM_CAPACITY_FACTOR
        ground_cover_ratio:
          description: Ground cover ratio for the installation when applicable.
          type: number
          format: float
        prevailing_wage_subject:
          description: Whether the project is subject to prevailing wage requirements.
          type: boolean
        minimal_shading_criteria:
          description: Whether the site meets minimal shading criteria.
          type: boolean
        qualified_installer_person:
          description: Name of the qualified installer contact for the ABP application.
          type: string
        construction_activities_completion_date:
          description: Date construction activities were completed (`YYYY-MM-DD`).
          type: string
          format: date
          example: '2015-05-15'
        is_expansion:
          description: Whether this application is an expansion of an existing system. Defaults to `false` when omitted.
          type: boolean
          example: false
      type: object

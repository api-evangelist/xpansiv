          type: boolean
          example: true
        colocated_facility:
          type: boolean
          example: false
        cmty_application_number:
          type: string
          maxLength: 100
        external_id:
          type: string
          example: EXTERNAL-123
          maxLength: 100
        comment_box:
          type: string
        dgg:
          type: boolean
          example: false
        address:
          $ref: '#/components/schemas/facilityAddressInput'
        owner:
          $ref: '#/components/schemas/facilityOwnerInput'
        installer:
          $ref: '#/components/schemas/facilityInstallerInput'
        meter:
          $ref: '#/components/schemas/facilityMeterInput'
        registry:

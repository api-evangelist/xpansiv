    facilityFlatCreateOrUpdateCommonProperties:
      description: Shared JSON properties for standard facility create (`facilityFlatCreateOrUpdate`), California DGG create (`facilityDggFlatCreateOrUpdate`), and Illinois ABP create (`facilityAbpFlatCreateOrUpdate`). Each schema defines its own `required` list, `state` rules, installer vs owner contact requirements, and the `panels` / `inverters` item schema.
      properties:
        name:
          type: string
          example: Facility name
          maxLength: 80
        i_am_owner:
          description: Whether the submitter is the generation attribute owner (`0` / `1`; string forms are coerced).
          example: 1
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
        i_have_solar_production_meter:
          example: 1
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
        facility_type:
          description: 'Possible values are:

            - RES (Residential)

            - COM (Commercial)

            - MUNI (Municipal)

            - CMTY (Community Solar)'
          type: string
          example: RES
          enum:
          - RES
          - COM
          - MUNI
          - CMTY
        facility_size:
          description: Facility DC capacity (DC kW). Minimum 0.000001; values are multiples of 0.000001.
          type: number
          example: 5.657
          minimum: 1.0e-06
        is_battery_backup:
          example: 1
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
          default: 0
        usable_energy:
          description: Required when `is_battery_backup` is `1`. Numeric strings are accepted.
          example: 2.36
          oneOf:
          - type: number
            minimum: 1.0e-06
          - type: string
        street:
          type: string
          example: 7312 Random Street
          maxLength: 80
        apartment_suite:
          type: string
          maxLength: 80
        city:
          type: string
          example: Yorktown
          maxLength: 80
        county:
          type: string
          example: York County
          maxLength: 80
        zip:
          type: string
          example: '24567'
        system_leased:
          example: 0
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
          default: 0
        referrer_company:
          type: string
          example: Referrer company name
          maxLength: 100
        owner_first_name:
          type: string
          example: John
        owner_last_name:
          type: string
          example: Doe
        owner_company_name:
          type: string
          example: Owner company name
        owner_email:
          type: string
          example: owner@email.com
          maxLength: 100
        owner_street:
          type: string
          example: 7312 Random Street
          maxLength: 80
        owner_apartment_suite:
          type: string
          maxLength: 80
        owner_city:
          type: string
          example: Yorktown
          maxLength: 80
        owner_state:
          type: string
          example: VA
        owner_zip:
          type: string
          example: '23693'
        system_cost:
          description: Optional for DGG creates; required for standard create. Numeric strings are accepted.
          example: 12345
          oneOf:
          - type: integer
            minimum: 1
          - type: string
        meter_manufacturer:
          type: string
          example: AstroPower
        meter_model_type:
          type: string
          example: GTY-7676
        meter_accuracy:
          description: '- ''revenue'' if the meter is a Revenue Grade Meter

            - ''standard'' if the meter is not a Revenue Grade Meter'
          type: string
          example: revenue
          enum:
          - revenue
          - standard
        meter_serial_number:
          type: string
          example: '12345'
          maxLength: 50
        meter_remote_data_collector:
          type: string
          example: Enphase
        online_monitoring_api_id:
          type: string
          example: '123456'
        operation_start_date:
          description: Optional operation start date (YYYY-MM-DD or legacy date string accepted by the server).
          type: string
          example: '2018-10-17'
        utility_interconnection_date:
          description: Utility interconnection date (YYYY-MM-DD or legacy date string).
          type: string
          example: '2018-10-17'
        reading_at_interconnection:
          description: Often `0` for new interconnects; optional unless your program requires it.
          type: number
          example: 39.95
          minimum: 0
        comment_box:
          type: string
        utility_name:
          description: Should be a valid utility for the site county; must match `GET /utilities` for DGG payloads.
          type: string
        inverters:
          type: array
          items:
            $ref: '#/components/schemas/inverterFlatCreate'
      type: object

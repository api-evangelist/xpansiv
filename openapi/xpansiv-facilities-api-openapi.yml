    facilityCreateOrUpdateCommonProperties:
      description: Payload format accepted by `POST /facilities` and `PATCH /facilities/{facility_id}`. Legacy flat payload keys are still accepted for backwards compatibility and will be deprecated in a future release.
      required:
      - name
      - i_am_owner
      - has_solar_production_meter
      - facility_type
      - facility_size
      - address
      - installer
      - referrer_company
      - owner
      - system_cost
      - meter
      properties:
        name:
          type: string
          example: Facility name
          maxLength: 80
        i_am_owner:
          description: Whether the submitter is the generation attribute owner (`0` / `1`; string forms are coerced).
          example: 1
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
          - type: boolean
        has_solar_production_meter:
          example: 1
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
          - type: boolean
        facility_type:
          description: 'Possible values are:

            - RES (Residential)

            - COM (Commercial)

            - MUNI (Municipal)

            - CMTY (Community Solar)'
          type: string
          example: RES
          enum:
          - RES
          - COM
          - MUNI
          - CMTY
        facility_size:
          description: Facility DC capacity (DC kW). Minimum 0.000001.
          type: number
          example: 5.657
          minimum: 1.0e-06
        is_battery_backup:
          example: 0
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
          - type: boolean
          default: 0
        system_leased:
          example: 0
          oneOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: string
            enum:
            - '0'
            - '1'
          - type: boolean
          default: 0
        leasing_company:
          description: Required when `system_leased` is `true`.
          type: string
          example: Leasing company name
          maxLength: 100
        usable_energy:
          description: Required when `is_battery_backup` is `true`. Numeric strings are accepted.
          example: 2.36
          oneOf:
          - type: number
            minimum: 1.0e-06
          - type: string
        system_cost:
          description: Numeric strings are accepted.
          example: 12345
          oneOf:
          - type: integer
            minimum: 1
          - type: string
        referrer_company:
          type: string
          example: Referrer company name
          maxLength: 100
        building_type:
          type: string
          example: Single Family Detached
        hostname:
          type: string
          example: Host name
          maxLength: 80
        facility_location_type:
          type: string
          example: Rooftop
          enum:
          - Rooftop
          - Parking canopy
          - Brownfield
          - Other
